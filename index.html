<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--brand:#123b85;--blue:#168fd0;--orange:#ff6500;--ink:#10203d;--bg:#f4f7fb;--line:#e5eaf2;--navy:#344FA9;--sky:#108EE6;--facture-orange:#FF6600}
*{box-sizing:border-box}
html,body,#app{margin:0;min-height:100%;width:100%;max-width:100%;overflow-x:hidden}
body{font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
h1,h2,h3,.display{font-family:'Plus Jakarta Sans',Inter,sans-serif}

/* ---------- Layout ---------- */
.app-shell{display:flex;min-height:100vh;width:100%}
.sidebar{position:fixed;inset:0 auto 0 0;width:245px;background:#fff;padding:20px;z-index:40;box-shadow:10px 0 35px #10234a0d}
.brand{display:flex;align-items:center;gap:11px;padding:0 3px;margin-bottom:42px}
.brand img{width:42px;height:42px;object-fit:contain}
.brand-name{font-weight:800;font-size:18px;letter-spacing:-.04em}
.brand-sub{font-size:9px;letter-spacing:.16em;color:#93a0b6;font-weight:800;text-transform:uppercase;margin-top:2px}
.side-nav{display:flex;flex-direction:column;gap:5px}
.nav-btn{width:100%;display:flex;align-items:center;gap:12px;padding:12px 13px;border-radius:12px;background:transparent;color:#1d2940;font-weight:700;font-size:13px;text-align:left;transition:.15s}
.nav-btn:hover,.nav-btn.active{background:#eaf1ff;color:var(--brand)}
.local-box{position:absolute;left:20px;right:20px;bottom:20px;padding:15px;border-radius:17px;background:linear-gradient(135deg,#123b85,#0b79c0);color:#fff;box-shadow:0 12px 26px #123b8530}
.local-box small{color:#cfe0ff;display:block;margin-bottom:5px}
.local-box strong{font-size:13px;line-height:1.35;display:block}
.workspace{width:calc(100% - 245px);margin-left:245px;min-width:0}
.topbar{height:80px;position:fixed;top:0;right:0;left:245px;z-index:30;background:#ffffffeb;backdrop-filter:blur(18px);border-bottom:1px solid #e8edf5;display:flex;align-items:center;justify-content:space-between;padding:0 40px}
.eyebrow{font-size:11px;color:var(--orange);font-weight:800;letter-spacing:.2em;text-transform:uppercase}
.page-heading{font-weight:800;font-size:25px;letter-spacing:-.05em;margin:3px 0 0}
.main{padding:112px 40px 40px;width:100%;max-width:1500px;min-width:0}
.mobile-menu-btn{display:none}.drawer{display:none}

/* ---------- Hero / stats ---------- */
.hero{position:relative;overflow:hidden;border-radius:27px;padding:42px 40px;background:linear-gradient(120deg,#102f70,#123b85 55%,#0c80bd);color:#fff;min-height:300px;box-shadow:0 18px 45px #123b852b}
.hero-copy{position:relative;z-index:2;max-width:650px}
.hero h2{font-size:48px;line-height:1.05;margin:10px 0 16px;letter-spacing:-.06em}
.hero p{max-width:530px;line-height:1.65;color:#dbeaff;margin:0}
.hero:after{content:'';position:absolute;width:400px;height:400px;border:42px solid #ffffff18;border-radius:50%;right:-75px;bottom:-185px}
.hero-dot{position:absolute;right:95px;top:34px;width:13px;height:13px;border-radius:50%;background:var(--orange);box-shadow:0 0 28px 10px #ff650060}
.primary{display:inline-flex;align-items:center;gap:8px;background:var(--brand);color:#fff;padding:12px 17px;border-radius:12px;font-size:13px;font-weight:800;box-shadow:0 10px 22px #123b8526;transition:.15s}
.hero .primary{background:#fff;color:var(--brand);margin-top:25px}
.primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.stats-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:32px}
.stat-card,.panel{background:#ffffffd9;border:1px solid #e5eaf250;border-radius:18px;box-shadow:0 15px 40px #10234a0b}
.stat-card{padding:19px;min-width:0}
.stat-label{font-size:11px;color:#94a0b4;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.stat-value{font-family:'Plus Jakarta Sans';font-size:25px;font-weight:800;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-sub{font-size:11px;color:#748096;margin-top:4px}
.bottom-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(260px,.65fr);gap:20px;margin-top:20px;min-width:0}
.panel{padding:20px;min-width:0}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:13px}
.panel-title{font-size:18px;font-weight:800;margin:0}
.muted{color:#748096;font-size:12px;margin:5px 0 0}
.recent-row{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid #edf0f5;padding:13px 0;min-width:0;cursor:pointer;transition:.15s;border-radius:10px}
.recent-row:hover{background:#f6f9ff}
.recent-main{display:flex;align-items:center;gap:11px;min-width:0}
.recent-main>div:last-child{min-width:0}
.recent-name{font-size:13px;font-weight:800}
.recent-meta{font-size:11px;color:#94a0b4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shortcut-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.shortcut{padding:16px;border-radius:15px;background:#edf4ff;color:var(--brand);text-align:left;font-weight:800;font-size:12px;min-width:0;transition:.15s}
.shortcut:hover{transform:translateY(-2px);box-shadow:0 10px 20px #123b8520}
.shortcut.orange{background:#fff2e8;color:var(--orange)}

/* ---------- Lists / filters ---------- */
.section-title{font-size:30px;font-weight:800;letter-spacing:-.05em;margin:4px 0}
.page-actions{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px}
.filters{display:grid;grid-template-columns:minmax(0,1fr) 150px 150px 160px;gap:10px;padding:14px;margin-bottom:17px}
.field{display:block;min-width:0}
.field span{display:block;font-size:11px;font-weight:800;color:#68758b;margin-bottom:7px}
.field input,.field select,.input{height:43px;width:100%;border:1px solid #dfe5ee;border-radius:11px;background:#fff;color:var(--ink);padding:0 12px;outline:none;transition:.15s}
.field input:focus,.field select:focus,.input:focus{border-color:#83a5df;box-shadow:0 0 0 4px #d9e6ff}
.list-head,.list-row{display:grid;grid-template-columns:minmax(180px,1.4fr) minmax(130px,1fr) minmax(150px,1.2fr) 110px 120px 180px;gap:14px;align-items:center;padding:14px 18px;min-width:0}
.list-head{background:#f7f9fc;color:#95a0b2;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.list-row{border-top:1px solid #edf0f5;cursor:pointer;transition:.15s}
.list-row:hover{background:#f6f9ff}
.client-cell{display:flex;align-items:center;gap:9px;min-width:0}
.client-cell>div:last-child{min-width:0}
.client-name{font-weight:800;font-size:13px}
.client-mail,.truncate{font-size:11px;color:#93a0b4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-actions{display:flex;justify-content:flex-end;gap:4px;flex-wrap:wrap}.row-export-btn{height:32px;padding:0 10px;border-radius:9px;background:#edf4ff;color:var(--brand);display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;transition:.15s}.row-export-btn:hover{background:#dbe8ff}
.icon-btn{width:32px;height:32px;border-radius:9px;background:transparent;color:#7e8aa0;display:inline-flex;align-items:center;justify-content:center;transition:.15s}
.icon-btn:hover{background:#edf4ff;color:var(--brand)}
.status{display:inline-flex;width:max-content;max-width:100%;padding:5px 8px;border-radius:99px;font-size:10px;font-weight:800}
.pending{background:#fff5d8;color:#a36b00}
.negotiated{background:#fff0e5;color:#d95d00}
.validated{background:#e7f8ee;color:#19834b}

/* ---------- Editor ---------- */
.editor-grid{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:22px;align-items:start}
.form-panel{padding:24px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.full{grid-column:1/-1}
.line-list{display:flex;flex-direction:column;gap:10px}
.line-item{display:grid;grid-template-columns:minmax(0,1fr) 75px 125px 38px;gap:8px;align-items:end}
.line-item .field span{font-size:10px}
.line-item input{height:40px}
.preview-sticky{position:sticky;top:100px;min-width:0}
.mini-wrap{background:#dfe5ee;padding:12px;border-radius:16px;overflow:hidden}
.mini-stage{position:relative;transform-origin:top left;overflow:hidden}
.mini-stage .invoice-paper{margin:0}
.preview-btn{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;font-weight:800}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid #dfe5ee;border-radius:11px;padding:0 14px;height:43px}
.toggle-row span{font-size:12px;font-weight:800;color:#33415c}
.switch{position:relative;width:42px;height:24px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:2}
.switch-track{position:absolute;inset:0;background:#dfe5ee;border-radius:99px;transition:.15s}
.switch-knob{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:.15s}
.switch input:checked+.switch-track{background:var(--brand)}
.switch input:checked+.switch-track+.switch-knob{transform:translateX(18px)}

/* ---------- Suivi des factures (tracking board) ---------- */
.tracking-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:4px}
.tracking-col{background:#ffffffd9;border:1px solid #e5eaf250;border-radius:18px;box-shadow:0 15px 40px #10234a0b;padding:16px;min-width:0;display:flex;flex-direction:column;gap:12px}
.tracking-col-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding-bottom:12px;border-bottom:1px solid #edf0f5}
.tracking-col-head strong{font-size:14px;display:block}
.tracking-col-total{font-size:12px;font-weight:800;color:var(--brand);white-space:nowrap}
.tracking-col-body{display:flex;flex-direction:column;gap:10px;min-height:40px}
.tracking-card{background:#fff;border:1px solid #edf0f5;border-radius:14px;padding:12px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:3px}
.tracking-card:hover{box-shadow:0 8px 20px #10234a14;transform:translateY(-1px)}
.tracking-card-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.tracking-type{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#8995aa}
.tracking-client{font-size:13px}
.tracking-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip-btn{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:99px;background:#edf4ff;color:var(--brand);font-size:10.5px;font-weight:800;white-space:nowrap}
.chip-btn:hover{background:#dbe8ff}
@media(max-width:1100px){.tracking-grid{grid-template-columns:minmax(0,1fr)}}

/* ---------- Invoice document (papier "Websoft Enterprise") ---------- */
.invoice-paper{display:flex;flex-direction:column;width:210mm;height:297mm;min-height:297mm;overflow:visible;background:#fff;color:#111;font-family:'ITC Avant Garde Gothic','Century Gothic','Avant Garde','Jost',Arial,sans-serif;margin:0 auto 4mm;position:relative;box-sizing:border-box}
.invoice-paper:last-child{margin-bottom:0}
@media print{.invoice-paper{page-break-after:always}.invoice-paper:last-child{page-break-after:auto}}
.invoice-content{display:flex;flex-direction:column;width:100%;height:auto;min-height:0;flex:1 1 auto;box-sizing:border-box}
.invoice-brand-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8mm;margin-bottom:4mm;min-height:24mm}
.invoice-logo{height:24mm;width:auto;object-fit:contain;flex:none}
.invoice-brand-right{flex:1;padding-top:1mm}
.invoice-brand-bar{display:flex;align-items:flex-end;width:100%;margin-bottom:3mm}
.invoice-bar-orange{background:var(--facture-orange);height:4px;width:calc(25% + 50px);position:relative;top:-7px}
.invoice-bar-blue{background:var(--sky);height:20px;flex:1}
.invoice-tagline{color:var(--navy);font-weight:700;font-size:9.5px;line-height:1.45;text-align:right;margin:0}
.invoice-body{flex:1 1 auto;position:relative}
.invoice-brand-foot{margin-top:auto;padding-top:6mm}
.invoice-foot-bars{display:flex;gap:5px;height:16px;margin-bottom:5mm}
.invoice-foot-bars span{flex:1}
.invoice-foot-bars span:nth-child(1){background:var(--navy)}
.invoice-foot-bars span:nth-child(2){background:var(--facture-orange)}
.invoice-foot-bars span:nth-child(3){background:var(--sky)}
.invoice-foot-panel{padding:0 6mm;display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:4mm}
.invoice-foot-panel div{display:flex;align-items:center;gap:2.5mm;font-size:9px;font-weight:700;color:#000;line-height:1.4}
.invoice-foot-icon{width:34px;height:34px;min-width:34px;border-radius:50%;border:1.5px solid #000;display:flex;align-items:center;justify-content:center;flex:none;color:#000}
.invoice-foot-legal{text-align:center;font-size:8.5px;line-height:1.7;margin-top:4mm;color:#000;font-weight:600}
.invoice-foot-legal b{color:var(--navy)}
.invoice-watermark{position:absolute;right:40px;bottom:-80px;pointer-events:none;z-index:0}
.invoice-watermark img{width:350px;height:auto;transform:rotate(5deg);display:block}
.invoice-meta{display:grid;grid-template-columns:1fr 1fr;gap:10mm;margin-top:3mm}
.invoice-label{background:var(--navy);color:#fff;text-align:center;font-weight:700;padding:6px;font-size:12px;border-radius:4px}
.invoice-small{font-size:11px}
.invoice-small span{font-weight:800}
.invoice-small p{margin:0 0 7px}
.invoice-orange{color:var(--facture-orange)}
.invoice-field-label{color:#6b7280}
.invoice-table{border-collapse:collapse;width:100%;font-size:11px;position:relative;z-index:1}
.invoice-table th,.invoice-table td{border:1px solid #111;padding:8px 7px}
.invoice-table th{background:transparent;text-align:center}
.invoice-table td:not(:nth-child(2)){text-align:center}
.invoice-sign-area{position:relative;min-height:0;text-align:center;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow:visible}
.invoice-sign-title,.invoice-sign-name{position:relative;z-index:4;display:block;line-height:1.3;margin:0}
.invoice-sign-title{max-width:46mm;margin:0 auto}
.invoice-sign-media{position:relative;width:100%;min-height:45mm;z-index:2;margin:0}
.invoice-signature,.invoice-stamp{position:absolute;left:calc(var(--x,50)*1%);top:calc(var(--y,50)*1%);transform:translate(-50%,-50%) rotate(calc(var(--r,0)*1deg));object-fit:contain;margin:0;display:block;z-index:2}

.invoice-margin-control{display:flex;gap:15px;margin:10px 0 15px;flex-wrap:wrap}
.invoice-margin-control label{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:#5b6785}

/* ---------- Draggable elements ---------- */
[data-drag-key]{cursor:grab;touch-action:none}
[data-drag-key].dragging{cursor:grabbing;outline:2px dashed #168fd0;outline-offset:3px;filter:drop-shadow(0 4px 10px #168fd066)}

/* ---------- Media cards ---------- */
.media-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}
.media-card{border:1px solid #e3e9f2;border-radius:16px;padding:15px;background:#fbfcfe}
.media-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.media-card-actions{display:flex;gap:4px;flex:none}
.upload-zone{display:block;border:1.5px dashed #b8c8df;border-radius:13px;padding:17px;text-align:center;background:#f7faff;color:#56708f;transition:.18s;margin-top:10px;position:relative;overflow:hidden}
.upload-zone:hover{border-color:#168fd0;background:#edf7ff}
.upload-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.media-thumb{height:80px;width:100%;object-fit:contain;background:#fff;border-radius:10px;border:1px solid #edf0f5}
.media-controls{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}
.media-controls label{font-size:10px;color:#68758b;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:8px}
.media-controls input[type=range]{width:100%;accent-color:#123b85}
.live-preview-label{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:#5b6785;margin:20px 0 8px}
.live-preview-wrap{background:#dfe5ee;width:100%;max-width:100%;height:auto;min-height:0;padding:0;margin:0;border-radius:16px;overflow:hidden;display:block;box-sizing:border-box}
.live-stage{position:relative;display:block;width:210mm;height:297mm;max-width:none;margin:0;transform-origin:top left;box-sizing:border-box}.live-stage .invoice-paper{margin:0;transform:none!important}

/* ---------- A4 preview modals ---------- */
.modal-backdrop{position:fixed;inset:0;z-index:80;background:#08152e99;display:flex;align-items:center;justify-content:center;padding:20px}
.a4-preview-modal{width:min(1120px,100%);max-height:min(94vh,980px);height:auto;display:flex;flex-direction:column}
.a4-toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;flex:none;padding-bottom:12px;border-bottom:1px solid #edf0f5}
.a4-scroll{overflow:auto;flex:1;background:#dfe5ee;padding:22px;display:flex;justify-content:center;align-items:flex-start}
.a4-fit-outer{margin:0 auto;display:block;flex:0 0 auto;align-items:flex-start}
.a4-preview-paper{box-shadow:0 12px 40px #10234a20;flex-shrink:0;margin:0 auto}
.modal{position:relative;width:min(920px,100%);max-height:90vh;overflow:hidden;background:#fff;border-radius:20px;padding:18px;box-shadow:0 30px 80px #0004}.modal-close{position:absolute;top:12px;right:12px;z-index:100;float:none}.a4-toolbar{padding:0 44px 12px 0}.a4-modal-actions{display:flex;justify-content:flex-end;align-items:center;flex:none;padding-top:12px;border-top:1px solid #edf0f5}.a4-scroll{min-height:0}
.hidden{display:none!important}

/* ---------- Install banner ---------- */
.install-banner{background:linear-gradient(135deg,#123b85,#0b79c0);color:#fff;padding:14px 24px;border-radius:14px;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;margin-bottom:20px;box-shadow:0 8px 25px #123b8530}
.install-banner .install-text{font-weight:600;font-size:14px;display:flex;align-items:center;gap:10px}
.install-banner .install-text svg{flex-shrink:0}
.install-banner .install-actions{display:flex;gap:8px}
.install-banner .install-actions button{padding:8px 16px;border-radius:10px;font-weight:700;font-size:12px;transition:.15s}
.install-banner .install-actions .btn-install{background:#fff;color:#123b85}
.install-banner .install-actions .btn-install:hover{transform:scale(1.03)}
.install-banner .install-actions .btn-dismiss{background:rgba(255,255,255,.2);color:#fff}
.install-banner .install-actions .btn-dismiss:hover{background:rgba(255,255,255,.3)}

(function(){
'use strict';
/* ---------- Filet de sécurité global : plus jamais d'écran blanc silencieux ---------- */
let fatalErrorShown=false;
function showFatalError(err){
  if(fatalErrorShown)return;fatalErrorShown=true;
  try{
    const box=document.createElement('div');
    box.id='fatal-error-box';
    box.style.cssText='position:fixed;inset:0;z-index:99999;background:#f4f7fb;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Inter,Arial,sans-serif;';
    const msg=String((err&&err.message)||err||'Erreur inconnue');
    const stack=String((err&&err.stack)||'');
    box.innerHTML='<div style="max-width:440px;width:100%;background:#fff;border-radius:20px;padding:28px;box-shadow:0 20px 50px rgba(16,32,61,.18);text-align:center">'
      +'<div style="width:52px;height:52px;border-radius:50%;background:#fee2e2;color:#c33;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:26px;font-weight:800">!</div>'
      +'<h2 style="font-weight:800;font-size:18px;margin:0 0 8px;color:#10203d">Un problème empêche l’application de démarrer</h2>'
      +'<p style="font-size:13px;color:#748096;margin:0 0 18px;line-height:1.55">Essayez de recharger la page. Si cela persiste, videz entièrement le cache du site depuis les réglages de votre navigateur (pas seulement les données de stockage local) — une ancienne version mise en cache peut bloquer le démarrage.</p>'
      +'<button id="fatal-reload" style="width:100%;height:44px;border-radius:11px;background:#123b85;color:#fff;font-weight:800;border:0;margin-bottom:10px">Recharger la page</button>'
      +'<button id="fatal-clear" style="width:100%;height:44px;border-radius:11px;background:#fff;color:#c33;font-weight:800;border:1px solid #f3c9c9">Effacer les données locales et recharger</button>'
      +'<details style="text-align:left;margin-top:14px;font-size:11px;color:#94a0b4"><summary>Détails techniques</summary><pre style="white-space:pre-wrap;word-break:break-word;margin-top:6px">'+msg.replace(/</g,'&lt;')+(stack?'\n\n'+stack.replace(/</g,'&lt;'):'')+'</pre></details>'
      +'</div>';
    document.body.appendChild(box);
    document.getElementById('fatal-reload')?.addEventListener('click',()=>location.reload());
    document.getElementById('fatal-clear')?.addEventListener('click',()=>{try{localStorage.clear()}catch(e){}try{sessionStorage.clear()}catch(e){}if(window.caches&&caches.keys)caches.keys().then(keys=>Promise.all(keys.map(k=>caches.delete(k)))).finally(()=>location.reload());else location.reload()});
  }catch(e){/* dernier recours : rien de plus possible */}
}

/* ---------- Authentification & verrouillage ---------- */
const AUTH_EMAIL='ssii.wede@gmail.com';

async function sha256Hex(str){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('')}
function readAuthSession(){try{return JSON.parse(localStorage.getItem(AUTH_KEY)||'null')}catch(e){return null}}

function showAuthGate(mode){const gate=document.getElementById('auth-gate');const fields=document.getElementById('auth-fields');if(!gate||!fields)return;fields.innerHTML=authFieldsHtml(mode);gate.classList.remove('hidden');releaseWakeLock();const form=document.getElementById('auth-form');if(form)form.addEventListener('submit',e=>{e.preventDefault();handleAuthSubmit(mode,form)});const err=document.getElementById('auth-error');if(err)err.classList.remove('show');if(Icons.createIcons)Icons.createIcons({root:gate})}
function hideAuthGate(){document.getElementById('auth-gate')?.classList.add('hidden');requestWakeLock()}
async function handleAuthSubmit(mode,form){const f=new FormData(form);const password=f.get('password')||'';const err=document.getElementById('auth-error');let ok=false;try{if(mode==='login'){const email=String(f.get('email')||'').trim().toLowerCase();if(email===AUTH_EMAIL){const hash=await sha256Hex(password);ok=hash===AUTH_HASH}if(ok)writeAuthSession({ok:true,lastActivity:Date.now()})}else{const hash=await sha256Hex(password);ok=hash===AUTH_HASH;if(ok)touchActivity()}}catch(e){ok=false;if(err){err.textContent='Connexion sécurisée indisponible (HTTPS requis).';err.classList.add('show')}return}if(ok){hideAuthGate()}else if(err){err.classList.add('show')}}
function initAuthGate(){const session=readAuthSession();if(session&&session.ok&&isSessionFresh()){hideAuthGate()}else if(session&&session.ok){showAuthGate('lock')}else{showAuthGate('login')}}
let lastActivityTouch=0;
function throttledActivityTouch(){const now=Date.now();if(now-lastActivityTouch>10000){lastActivityTouch=now;touchActivity()}}
['click','keydown','touchstart','mousemove','scroll'].forEach(evt=>document.addEventListener(evt,throttledActivityTouch,{passive:true}));

const seed={id:makeId(),type:'proforma',status:'pending',ref:'FACT PRO WEDE-202609/123',date:'2026-09-01',client:'Res\'AU',clientNumber:'',address:'Lomé, Togo',phone:'',email:'infos.resau@gmail.com',object:'Renouvellement de l\'hébergement web',payment:'Paiement comptant',delay:'6h après réception du paiement',discount:'',validityDays:'',requiresValidation:false,items:[{designation:'Renouvellement de l\'hébergement web (12 mois)',qty:1,unit:100000},{designation:'Configuration et frais agence',qty:1,unit:25000}],createdAt:new Date().toISOString()};
function readStore(){try{const raw=localStorage.getItem(STORE);if(raw)return JSON.parse(raw)}catch(e){}const initial={invoices:[seed],slips:[],settings:{...baseSettings},page:'dashboard'};localStorage.setItem(STORE,JSON.stringify(initial));return initial}
let state=readStore();state.settings={...baseSettings,...(state.settings||{})};state.slips=state.slips||[];let page=state.page||'dashboard', editingId=null, editingSlipId=null, filters={q:'',from:'',to:'',sort:'date-desc'};

tal HT</div><strong id="editor-total" style="font-size:25px;color:var(--brand)">${money(total(x))} FCFA</strong></div></div></section><section class="panel form-panel" style="margin-top:18px"><div class="panel-head"><div><h2 class="panel-title">Conditions & validité</h2><p class="muted">Réduction, modalités, moyens de paiement et validité de l'offre.</p></div></div><div class="form-grid">${input('Réduction (montant en FCFA, laisser vide si aucune)','discount',x.discount,'number','min="0" inputmode="decimal"')}${input('Validité de l\'offre (jours ouvrés)','validityDays',x.validityDays,'number','min="0"')}${input('Modalités de paiement','payment',x.payment)}${input('Délai d\'exécution','delay',x.delay)}</div><div class="toggle-row" style="margin-top:15px"><span>Validation par bon pour accord</span><label class="switch"><input type="checkbox" name="requiresValidation" ${x.requiresValidation?'checked':''}><span class="switch-track"></span><span class="switch-knob"></span></label></div></section><div style="display:flex;gap:10px;margin-top:18px"><button type="button" class="input" style="width:auto;padding:0 18px;font-weight:800" data-nav="invoices">Annuler</button><button type="submit" class="primary">${ico('save',17)} Enregistrer la facture</button></div></div><aside class="preview-sticky"><div class="panel-head"><strong>Aperçu rapide</strong><span class="muted">A4 · prêt à exporter</span></div><div class="mini-wrap"><div class="mini-stage" id="mini-stage">${invoiceMarkup(x)}</div></div><button type="button" class="input preview-btn" data-action="preview-current">${ico('eye',17)} Voir l\'aperçu complet</button></aside></form>`}

function invoiceConditions(x){const s=state.settings;const discountAmount=Number(x.discount)||0;const discountLine=discountAmount?`<p><b><span class="invoice-orange">Réduction :</span> ${money(discountAmount)} FCFA</b></p>`:'';const paymentMethodsLine=s.paymentMethods?`<p style="margin-top:5mm"><span class="invoice-orange">Moyens de paiement acceptés :</span> ${esc(s.paymentMethods)}</p>`:'';const modLines=[x.payment?`<li style="margin-bottom:3mm">• <b>Paiement :</b> ${esc(x.payment)}</li>`:'',x.delay?`<li>• <b>Délai d’exécution :</b> ${esc(x.delay)}</li>`:''].filter(Boolean).join('');const modalitiesBlock=modLines?`<p style="margin-top:7mm"><b>Modalités :</b></p><ul style="margin:4mm 0 0 5mm;padding:0">${modLines}</ul>`:'';return `${discountLine}<p><b>Net à payer : ${money(netTotal(x))} FCFA</b></p>${modalitiesBlock}${paymentMethodsLine}`}

function invoiceMarkup(x,editable){const s=state.settings;const typeLabel=getTypeLabel(x.type);const marginNumber=(value,fallback)=>{const n=Number(value);return Number.isFinite(n)?Math.max(0,Math.min(30,n)):fallback};const marginTop=marginNumber(s.marginTop,8);const marginBottom=marginNumber(s.marginBottom,8);const items=x.items&&x.items.length?x.items:[{designation:'',qty:0,unit:0}];const FIRST_MAX=9,NEXT_MAX=22;let chunks;if(items.length<=FIRST_MAX){chunks=[items]}else{chunks=[items.slice(0,FIRST_MAX)];let rest=items.slice(FIRST_MAX);while(rest.length){chunks.push(rest.slice(0,NEXT_MAX));rest=rest.slice(NEXT_MAX)}}let runningIndex=0;const pages=chunks.map((chunk,pageIdx)=>{const isFirst=pageIdx===0;const isLast=pageIdx===chunks.length-1;const rowsHtml=invoiceItemsRows(chunk,runningIndex);runningIndex+=chunk.length;const totalRowHtml=isLast?`<tr><td></td><td></td><td>-</td><td>-</td><td>-</td></tr><tr><td colspan="4" style="text-align:right;font-weight:bold">Total HT</td><td style="font-weight:bold">${money(total(x))}</td></tr>`:'';const metaHtml=isFirst?`<div class="invoice-meta"><div><div class="invoice-label">${typeLabel}</div><div class="invoice-small" style="margin-top:8mm"><p><span class="invoice-field-label">Réf. :</span> <b>${esc(x.ref)}</b></p><p><span class="invoice-field-label">Date :</span> <b>${dateFr(x.date)}</b></p></div></div><div><div class="invoice-label">DESTINATAIRE</div><div class="invoice-small" style="margin-top:8mm"><p><span class="invoice-field-label">Client :</span> <b>${esc(x.client)}</b></p>${optLine('N° Client',x.clientNumber)}${optLine('Adresse',x.address)}${optLine('Téléphone',x.phone)}${optLine('E-mail',x.email)}</div></div></div><p style="margin:12mm 0 8mm;font-size:12px"><span class="invoice-orange"><b>Objet :</b></span> <b>${esc(x.object)}</b></p>`:`<p style="margin:0 0 6mm;font-size:10px;color:#6b7280">Suite — ${esc(x.ref)} (page ${pageIdx+1}/${chunks.length})</p>`;const watermarkHtml=isLast?`<div class="invoice-watermark"><img function slipRefNext(){const prefix='BORD WEDE-';const ym=new Date().toISOString().slice(0,7).replace('-','');const nums=state.slips.map(sVal=>Number(String(sVal.slipRef||'').split('/').pop())).filter(Boolean);const n=Math.max(0,...nums)+1;return prefix+ym+'/'+n}
function eligibleInvoices(){return state.invoices.filter(x=>x.type!=='proforma'&&x.status==='validated')}
function numberToFrenchWords(num){num=Math.round(Number(num)||0);if(num<=0)return 'zéro franc CFA';const units=['','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'];const tens=['','','vingt','trente','quarante','cinquante','soixante','soixante','quatre-vingt','quatre-vingt'];function twoDigits(nb){if(nb<20)return units[nb];const t=Math.floor(nb/10),u=nb%10;if(t===7||t===9){if(u===1&&t===7)return tens[t]+'-et-onze';return tens[t]+'-'+units[10+u]}if(u===0)return t===8?'quatre-vingts':tens[t];if(u===1&&t!==8)return tens[t]+'-et-un';return tens[t]+'-'+units[u]}function threeDigits(nb){const c=Math.floor(nb/100),r=nb%100;let str='';if(c>0){str+=(c===1?'cent':units[c]+' cent');if(c>1&&r===0)str+='s'}if(r>0)str+=(str?' ':'')+twoDigits(r);return str}const groups=[{value:1000000000,singular:'milliard',plural:'milliards'},{value:1000000,singular:'million',plural:'millions'},{value:1000,singular:'mille',plural:'mille'}];let remaining=num,parts=[];for(const g of groups){const count=Math.floor(remaining/g.value);if(count>0){if(g.value===1000){parts.push(count===1?'mille':threeDigits(count)+' mille')}else{parts.push((count===1?'un':threeDigits(count))+' '+(count>1?g.plural:g.singular))}remaining%=g.value}}if(remaining>0)parts.push(threeDigits(remaining));let words=parts.join(' ').replace(/\s+/g,' ').trim();words=words.charAt(0).toUpperCase()+words.slice(1);return words+' francs CFA'}
function bordereauMarkup(sVal){const s=state.settings;const marginNumber=(value,fallback)=>{const n=Number(value);return Number.isFinite(n)?Math.max(0,Math.min(30,n)):fallback};const marginTop=marginNumber(s.marginTop,8);const marginBottom=marginNumber(s.marginBottom,8);const balance=(Number(sVal.invoiceAmount)||0)-(Number(sVal.previouslyPaid)||0)-(Number(sVal.collected)||0);return `<div class="invoice-paper"><div class="invoice-content" style="padding:${marginTop}mm 14mm ${marginBottom}mm"><div style="display:flex;flex-direction:column;flex:1;min-height:0">${invoiceHeader()}<div class="invoice-body"><div class="invoice-watermark"><img src="${ASSETS.codeIcon}" alt=""></div><div class="invoice-label" style="max-width:85mm;margin:2mm 0 7mm">BORDEREAU D’ENCAISSEMENT</div><div class="invoice-small"><p><span class="invoice-field-label">N° Bordereau :</span> <b>${esc(sVal.slipRef)}</b></p><p><span class="invoice-field-label">N° Facture :</span> <b>${esc(sVal.invoiceRef)}</b></p><p><span class="invoice-field-label">Date de la facture :</span> <b>${dateFr(sVal.invoiceDate)}</b></p><p><span class="invoice-field-label">Date d’encaissement :</span> <b>${dateFr(sVal.collectionDate)}</b></p></div><p style="margin:8mm 0 3mm;font-size:12px;font-weight:800">INFORMATIONS DU CLIENT</p><div class="invoice-small"><p><span class="invoice-field-label">Nom / Raison sociale :</span> <b>${esc(sVal.client)}</b></p>${optLine('Adresse',sVal.address)}${optLine('Téléphone',sVal.phone)}${optLine('E-mail',sVal.email)}</div><p style="margin:8mm 0 3mm;font-size:12px;font-weight:800">DÉTAIL DE L’ENCAISSEMENT</p><div class="invoice-small"><p><span class="invoice-orange"><b>Objet :</b></span> <b>Règlement de la facture n° ${esc(sVal.invoiceRef)}</b></p><p><span class="invoice-field-label">Montant de la facture :</span> <b>${money(sVal.invoiceAmount)} FCFA</b></p>${sVal.previouslyPaid?optLine('Montant déjà réglé',money(sVal.previouslyPaid)+' FCFA'):''}<p><span class="invoice-field-label">Montant encaissé :</span> <b>${money(sVal.collected)} FCFA</b></p><p><span class="invoice-field-label">Solde restant dû :</span> <b>${money(balance)} FCFA</b></p>${optLine('Mode de paiement',sVal.paymentMethod)}</div><p style="margin:6mm 0 2mm;font-size:11px"><span class="invoice-field-label">Montant encaissé en lettres :</span></p><p style="font-weight:800;font-size:11px">${esc(sVal.amountInWords||'')}</p><p style="margin:8mm 0 3mm;font-size:12px;font-weight:800">ATTESTATION D’ENCAISSEMENT</p><p style="font-size:11px;line-height:1.6">Nous certifions avoir reçu de <b>${esc(sVal.client)}</b> la somme de <b>${money(sVal.collected)} FCFA</b> (${esc(sVal.amountInWords||'')}), correspondant au règlement de la facture n° <b>${esc(sVal.invoiceRef)}</b>.</p><p style="font-size:11px;margin-top:4mm"><span class="invoice-field-label">Statut du règlement :</span> <b>${esc(sVal.settlementStatus)}</b></p><p style="font-size:11px;margin-top:4mm">Fait à <b>${esc(sVal.place)}</b>, le <b>${dateFr(sVal.collectionDate)}</b>.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:10mm;margin-top:8mm;position:relative;z-index:1"><div class="invoice-sign-area"><strong class="invoice-sign-title">Établi par</strong><div class="invoice-sign-media">${s.signature?`<img class="invoice-signature" src="${s.signature}" style="--x:${Number(s.signatureX)||50};--y:${Number(s.signatureY)||42};--r:${Number(s.signatureRotation)||0};width:${Number(s.signatureSize)||34}mm;height:auto">`:''}${s.stamp?`<img class="invoice-stamp" src="${s.stamp}" style="--x:${Number(s.stampX)||50};--y:${Number(s.stampY)||58};--r:${Number(s.stampRotation)||0};width:${Number(s.stampSize)||30}mm;height:auto">`:''}</div><strong class="invoice-sign-name">${esc(sVal.cashier||s.manager)}</strong></div><div class="invoice-sign-area"><strong class="invoice-sign-title">Client</strong><div class="invoice-sign-media"></div><strong class="invoice-sign-name">${esc(sVal.client)}</strong></div></div></div></div>${invoiceFooter()}</div></div>`}
function findInvoiceForSlipForm(form){const id=form.querySelector('[name=invoiceId]')?.value;return state.invoices.find(iv=>iv.id===id)}
function buildSlipFromForm(form,existing){const f=new FormData(form);const invoice=findInvoiceForSlipForm(form);return {id:existing?.id||makeId(),invoiceId:invoice?.id||'',invoiceRef:invoice?.ref||'',invoiceDate:invoice?.date||'',invoiceAmount:invoice?netTotal(invoice):0,client:invoice?.client||'',address:invoice?.address||'',phone:invoice?.phone||'',email:invoice?.email||'',slipRef:f.get('slipRef')||slipRefNext(),collectionDate:f.get('collectionDate'),previouslyPaid:Number(f.get('previouslyPaid'))||0,collected:Number(f.get('collected'))||0,paymentMethod:f.get('paymentMethod')||'',amountInWords:f.get('amountInWords')||'',settlementStatus:f.get('settlementStatus')||'Réglé intégralement',place:f.get('place')||'',cashier:f.get('cashier')||state.settings.manager,createdAt:existing?.createdAt||new Date().toISOString()}}
function slipPreviewObject(base,invoice){return {invoiceId:invoice?.id||'',invoiceRef:invoice?.ref||'',invoiceDate:invoice?.date||'',invoiceAmount:invoice?netTotal(invoice):0,client:invoice?.client||'',address:invoice?.address||'',phone:invoice?.phone||'',email:invoice?.email||'',slipRef:base.slipRef,collectionDate:base.collectionDate,previouslyPaid:base.previouslyPaid||0,collected:base.collected||0,paymentMethod:base.paymentMethod||'',amountInWords:base.amountInWords||'',settlementStatus:base.settlementStatus,place:base.place,cashier:base.cashier}}
function bordereauEditor(){const sVal=editingSlipId?state.slips.find(sV=>sV.id===editingSlipId):null;const linked=sVal?state.invoices.find(iv=>iv.id===sVal.invoiceId):null;const eligible=eligibleInvoices();const base=sVal||{invoiceId:linked?.id||(eligible[0]?.id||''),slipRef:slipRefNext(),collectionDate:new Date().toISOString().slice(0,10),previouslyPaid:'',collected:'',paymentMethod:'',amountInWords:'',settlementStatus:'Réglé intégralement',place:(state.settings.address||'').split(',')[0]||'Porto-Novo',cashier:state.settings.manager};const chosen=eligible.find(iv=>iv.id===base.invoiceId)||linked;const options=eligible.map(iv=>`<option value="${iv.id}" ${base.invoiceId===iv.id?'selected':''}>${esc(iv.ref)} — ${esc(iv.client)} (${money(netTotal(iv))} FCFA)</option>`).join('');return `<form id="slip-form" class="editor-grid"><div style="min-width:0"><section class="panel form-panel"><div class="panel-head"><div><h2 class="panel-title">Facture réglée</h2><p class="muted">Seules les factures validées (hors pro forma) sont proposées. Les informations du client sont reprises automatiquement.</p></div></div><div class="form-grid"><label class="field full"><span>Facture liée</span><select class="input" name="invoiceId" data-invoice-select>${eligible.length?options:'<option value="">Aucune facture validée disponible</option>'}</select></label>${input('N° Bordereau','slipRef',base.slipRef)}${input('Date d\'encaissement','collectionDate',base.collectionDate,'date')}</div></section><section class="panel form-panel" style="margin-top:18px"><div class="panel-head"><div><h2 class="panel-title">Encaissement</h2><p class="muted">Montants et mode de règlement.</p></div></div><div class="form-grid">${input('Montant déjà réglé (avant ce versement)','previouslyPaid',base.previouslyPaid,'number','min="0"')}${input('Montant encaissé aujourd\'hui','collected',base.collected,'number','min="0"')}${input('Mode de paiement','paymentMethod',base.paymentMethod)}<label class="field"><span>Statut du règlement</span><select class="input" name="settlementStatus"><option ${base.settlementStatus==='Réglé intégralement'?'selected':''}>Réglé intégralement</option><option ${base.settlementStatus==='Réglé partiellement'?'selected':''}>Réglé partiellement</option><option ${base.settlementStatus==='Non réglé'?'selected':''}>Non réglé</option></select></label></div><label class="field full" style="margin-top:15px"><span>Montant encaissé en lettres</span><textarea class="input" name="amountInWords" style="height:auto;min-height:60px;padding:10px 12px">${esc(base.amountInWords)}</textarea></label><button type="button" class="input" style="width:auto;margin-top:8px;font-weight:800" data-action="fill-words">${ico('sparkles',15)} Générer automatiquement en lettres</button></section><section class="panel form-panel" style="margin-top:18px"><div class="form-grid">${input('Fait à (lieu)','place',base.place)}${input('Établi par (nom du caissier)','cashier',base.cashier)}</div></section><div style="display:flex;gap:10px;margin-top:18px"><button type="button" class="input" style="width:auto;padding:0 18px;font-weight:800" data-nav="bordereau">Annuler</button><button type="submit" class="primary">${ico('save',17)} Enregistrer le bordereau</button></div></div><aside class="preview-sticky"><div class="panel-head"><strong>Aperçu rapide</strong><span class="muted">A4 · prêt à exporter</span></div><div class="mini-wrap"><div class="mini-stage" id="mini-stage">${bordereauMarkup(slipPreviewObject(base,chosen))}</div></div><button type="button" class="input preview-btn" data-action="preview-slip-current">${ico('eye',17)} Voir l\'aperçu complet</button></aside></form>`}
function saveSlip(e){e.preventDefault();const invoice=findInvoiceForSlipForm(e.currentTarget);if(!invoice){notify('Sélectionnez une facture validée','warning');return}const existing=editingSlipId?state.slips.find(sV=>sV.id===editingSlipId):null;const rec=buildSlipFromForm(e.currentTarget,existing);const idx=state.slips.findIndex(sV=>sV.id===rec.id);if(idx>=0)state.slips[idx]=rec;else state.slips.unshift(rec);persist();notify(idx>=0?'Bordereau mis à jour':'Bordereau enregistré');page='bordereau';editingSlipId=null;persist();render();setTimeout(()=>offerSlipPdf(rec.id),120)}
function editSlip(id){editingSlipId=id;page='bordereau-form';persist();render()}
function removeSlip(id){confirmBox('Supprimer ce bordereau ?').then(r=>{if(r.isConfirmed){state.slips=state.slips.filter(sV=>sV.id!==id);persist();notify('Bordereau supprimé');render()}})}
function bordereauList(){const arr=state.slips.slice().sort((a,b)=>(b.collectionDate||'').localeCompare(a.collectionDate||''));const warn=eligibleInvoices().length?'':`<div class="panel" style="padding:16px 18px;margin-bottom:16px;color:#a36b00;background:#fff8e6;border:1px solid #ffe6ad"><strong>Aucune facture validée</strong><p class="muted" style="margin-top:4px;color:#a36b00">Validez une facture (hors pro forma) dans le Suivi des factures pour pouvoir générer un bordereau.</p></div>`;return `<div class="page-actions"><div><div class="eyebrow">Encaissements</div><h2 class="section-title">Bordereaux</h2><p class="muted">Générez un bordereau d’encaissement à partir d’une facture validée.</p></div><button class="primary" data-nav="bordereau-form">${ico('plus',17)} Générer un bordereau</button></div>${warn}<div class="panel" style="padding:0;overflow:hidden"><div class="list-head" style="grid-template-columns:minmax(180px,1.4fr) minmax(120px,1fr) minmax(120px,1fr) 130px 190px"><div>Client</div><div>N° Bordereau</div><div>Facture liée</div><div>Encaissé</div><div>Actions</div></div>${arr.length?arr.map(slipRow).join(''):'<div style="padding:50px;text-align:center;color:#94a0b4">Aucun bordereau pour l’instant</div>'}</div>`}
function slipRow(sVal){return `<div class="list-row" style="grid-template-columns:minmax(180px,1.4fr) minmax(120px,1fr) minmax(120px,1fr) 130px 190px" data-slip-preview="${sVal.id}"><div class="client-cell"><div class="rounded-xl bg-blue-50 text-blue-800 p-2">${ico('wallet',16)}</div><div><div class="client-name">${esc(sVal.client||'Client')}</div><div class="client-mail">${esc(sVal.paymentMethod)}</div></div></div><div class="truncate">${esc(sVal.slipRef)}</div><div class="truncate">${esc(sVal.invoiceRef)}</div><div><strong style="font-size:12px">${money(sVal.collected)} FCFA</strong><div style="font-size:11px;color:#94a0b4">${dateFr(sVal.collectionDate)}</div></div><div class="list-actions"><button class="icon-btn" title="Aperçu" data-slip-preview-btn="${sVal.id}">${ico('eye',16)}</button><button class="icon-btn" title="Modifier" data-slip-edit="${sVal.id}">${ico('pencil',16)}</button><button class="icon-btn" title="Exporter" data-slip-pdf="${sVal.id}">${ico('file-down',16)}</button><button class="icon-btn" title="Partager" data-slip-share="${sVal.id}">${ico('share-2',16)}</button><button class="icon-btn" title="Supprimer" data-slip-delete="${sVal.id}">${ico('trash-2',16)}</button></div></div>`}
function list(){let arr=state.invoices.slice();const q=filters.q.toLowerCase();if(q)arr=arr.filter(x=>[x.client,x.ref,x.object,...x.items.map(i=>i.designation)].join(' ').toLowerCase().includes(q));if(filters.from)arr=arr.filter(x=>x.date>=filters.from);if(filters.to)arr=arr.filter(x=>x.date<=filters.to);arr.sort((a,b)=>filters.sort==='client'?(a.client||'').localeCompare(b.client||''):filters.sort==='amount'?total(b)-total(a):filters.sort==='date-asc'?(a.date||'').localeCompare(b.date||''):(b.date||'').localeCompare(a.date||''));return `<div class="page-actions"><div><div class="eyebrow">Bibliothèque</div><h2 class="section-title">Mes factures</h2><p class="muted">Recherchez par client, période, objet ou désignation.</p></div><button class="primary" data-nav="create">${ico('plus',17)} Créer une facture</button></div><div class="panel filters"><label class="field search-field"><span>Recherche</span><input data-filter="q" class="input" value="${esc(filters.q)}" placeholder="Client, référence, objet..."></label><label class="field"><span>Du</span><input data-filter="from" type="date" class="input" value="${filters.from}"></label><label class="field"><span>Au</span><input data-filter="to" type="date" class="input" value="${filters.to}"></label><label class="field"><span>Trier par</span><select data-filter="sort" class="input"><option value="date-desc" ${filters.sort==='date-desc'?'selected':''}>Plus récentes</option><option value="date-asc" ${filters.sort==='date-asc'?'selected':''}>Plus anciennes</option><option value="client" ${filters.sort==='client'?'selected':''}>Nom client</option><option value="amount" ${filters.sort==='amount'?'selected':''}>Montant</option></select></label></div><div class="panel" style="padding:0;overflow:hidden"><div class="list-head"><div>Client</div><div>Référence</div><div>Objet</div><div>Statut</div><div>Date / Total</div><div>Actions</div></div>${arr.length?arr.map(row).join(''):'<div style="padding:50px;text-align:center;color:#94a0b4">Aucune facture trouvée</div>'}</div>`}

function trackingBoard(){const cols=[{key:'pending',label:'En attente'},{key:'negotiated',label:'Négociées'},{key:'validated',label:'Validées'}];const groups=cols.map(c=>({...c,items:state.invoices.filter(x=>(x.status||'pending')===c.key).sort((a,b)=>(b.date||'').localeCompare(a.date||''))}));return `<div class="page-actions"><div><div class="eyebrow">Pilotage</div><h2 class="section-title">Suivi des factures</h2><p class="muted">Faites avancer chaque document, étape par étape.</p></div><button class="primary" data-nav="create">${ico('plus',17)} Créer une facture</button></div><div class="tracking-grid">${groups.map(trackingColumn).join('')}</div>`}
function trackingColumn(col){const totalAmount=col.items.reduce((a,x)=>a+total(x),0);return `<div class="tracking-col"><div class="tracking-col-head"><div><strong>${col.label}</strong><div class="muted">${col.items.length} document${col.items.length>1?'s':''}</div></div><div class="tracking-col-total">${money(totalAmount)} FCFA</div></div><div class="tracking-col-body">${col.items.length?col.items.map(trackingCard).join(''):'<p class="muted" style="padding:6px 0">Aucun document</p>'}</div></div>`}
function trackingCard(x){const isProforma=x.type==='proforma';const st=x.status||'pending';let nextAction='';if(x.convertedToInvoiceId){const inv=state.invoices.find(i=>i.id===x.convertedToInvoiceId);nextAction=inv?`<button class="chip-btn" data-edit="${inv.id}">${ico('badge-check',13)} Voir la facture ${esc(inv.ref)}</button>`:''}else if(st==='pending'){nextAction=(isProforma?`<button class="chip-btn" data-status="negotiated" data-id="${x.id}">${ico('messages-square',13)} Négocier</button>`:'')+`<button class="chip-btn" data-status="validated" data-id="${x.id}">${ico('check-check',13)} Valider</button>`}else if(st==='negotiated'){nextAction=`<button class="chip-btn" data-status="validated" data-id="${x.id}">${ico('check-check',13)} Valider</button>`}const convertedBadge=x.convertedToInvoiceId?`<span class="tracking-type" style="color:#19834b">Convertie</span>`:`<span class="tracking-type">${isProforma?'Pro forma':'Facture'}</span>`;return `<div class="tracking-card" data-preview="${x.id}"><div class="tracking-card-top"><span class="status ${st}">${st==='validated'?'Validée':st==='negotiated'?'Négociée':'En attente'}</span>${convertedBadge}</div><strong class="tracking-client">${esc(x.client||'Client')}</strong><span class="muted" style="font-size:11px">${esc(x.ref)} · ${dateFr(x.date)}</span><strong style="display:block;margin-top:6px">${money(total(x))} FCFA</strong><div class="tracking-actions" onclick="event.stopPropagation()">${nextAction}<button class="icon-btn" title="Modifier" data-edit="${x.id}">${ico('pencil',14)}</button><button class="icon-btn" title="Exporter" data-pdf="${x.id}">${ico('file-down',14)}</button></div></div>`}
function row(x){const st=x.status||'pending';const sourceTag=x.sourceProformaId?`<span class="muted" style="font-size:10px;display:block">issue d’une pro forma</span>`:x.convertedToInvoiceId?`<span class="muted" style="font-size:10px;display:block;color:#19834b">→ convertie en facture</span>`:'';return `<div class="list-row" data-preview="${x.id}"><div class="client-cell"><div class="rounded-xl bg-blue-50 text-blue-800 p-2">${ico('file-text',16)}</div><div><div class="client-name">${esc(x.client||'Client')}</div><div class="client-mail">${esc(x.email)}</div>${sourceTag}</div></div><div class="truncate">${esc(x.ref)}</div><div class="truncate">${esc(x.object)}</div><div><span class="status ${st}">${st==='validated'?'Validée':st==='negotiated'?'Négociée':'En attente'}</span></div><div><div style="font-size:12px">${dateFr(x.date)}</div><strong style="font-size:12px">${money(total(x))} FCFA</strong></div><div class="list-actions"><button class="icon-btn" title="Aperçu" data-preview="${x.id}">${ico('eye',16)}</button><button class="icon-btn" title="Modifier" data-edit="${x.id}">${ico('pencil',16)}</button><button class="row-export-btn" title="Exporter le PDF" data-pdf="${x.id}">${ico('file-down',15)} <span>Exporter</span></button><button class="icon-btn" title="Partager" data-share="${x.id}">${ico('share-2',16)}</button><button class="icon-btn" title="Supprimer" data-delete="${x.id}">${ico('trash-2',16)}</button>${!x.convertedToInvoiceId?(x.type==='proforma'?`<button class="icon-btn" title="Négociée" data-status="negotiated" data-id="${x.id}">${ico('messages-square',16)}</button><button class="icon-btn" title="Valider" data-status="validated" data-id="${x.id}">${ico('check-check',16)}</button>`:st!=='validated'?`<button class="icon-btn" title="Valider" data-status="validated" data-id="${x.id}">${ico('check-check',16)}</button>`:''):''}</div></div>`}

/* ---------- Settings ---------- */
function mediaCard(key,label,icon){const s=state.settings;const value=s[key]||'';const isCustom=!!value;const r=mediaRanges[key]||{size:[15,80],x:[-30,130],y:[-30,130],rotation:[0,360]};const thumb=value;return `<div class="media-card"><div class="media-card-head"><div><strong style="font-size:13px">${ico(icon,17)} ${label}</strong><p class="muted">Glissez l’image sur l’aperçu ci-dessous, à tout moment.</p></div><div class="media-card-actions">${isCustom?`<button type="button" class="icon-btn" data-clear-image="${key}" title="Supprimer l’image">${ico('trash-2',16)}</button>`:''}<button type="button" class="icon-btn" data-reset-media="${key}" title="Réinitialiser la position">${ico('rotate-ccw',16)}</button></div></div><label class="upload-zone">${thumb?`<img class="media-thumb" src="${thumb}">`:`<div style="font-size:24px">${ico('upload-cloud',24)}</div><div style="font-weight:800;margin-top:7px">Importer une image</div>`}<input data-image="${key}" type="file" accept="image/*"></label><div class="media-controls"><label>Taille <input type="range" min="${r.size[0]}" max="${r.size[1]}" value="${s[key+'Size']||r.size[0]}" data-media-range="${key}Size"></label><label>Position X <input type="range" min="${r.x[0]}" max="${r.x[1]}" value="${s[key+'X']||0}" data-media-range="${key}X"></label><label>Position Y <input type="range" min="${r.y[0]}" max="${r.y[1]}" value="${s[key+'Y']||0}" data-media-range="${key}Y"></label><label>Rotation <input type="range" min="0" max="360" value="${s[key+'Rotation']||0}" data-media-range="${key}Rotation"></label></div></div>`}
function settings(){const s=state.settings;return `<div style="max-width:1040px;width:100%"><div class="panel form-panel"><div class="panel-head"><div><h2 class="panel-title">Informations de l’entreprise</h2><p class="muted">Identité affichée sur vos factures.</p></div></div><form id="settings-form" class="form-grid">${input('Nom de l’entreprise','companyName',s.companyName)}${input('Titre affiché au-dessus de la signature (ex: Le Gérant de Websoft Enterprise Digital Engineering)','title',s.title)}${input('Nom du gérant','manager',s.manager)}${input('Téléphones','phone',s.phone)}${input('Adresse','address',s.address)}${input('E-mail','email',s.email)}${input('Site web','website',s.website)}<div class="full">${input('Modes de paiement acceptés','paymentMethods',s.paymentMethods)}</div><div class="full"><button class="primary">${ico('save',17)} Enregistrer</button></div></form></div><div class="panel form-panel" style="margin-top:18px"><div class="panel-head"><div><h2 class="panel-title">Éléments visuels</h2><p class="muted">Le logo de l’en-tête est fixe (fourni par le papier de l’entreprise). Importez votre signature et votre cachet, puis positionnez-les librement, à tout moment, sur l’aperçu ci-dessous pour trouver le bon ajustement.</p></div></div><div class="media-cards">${mediaCard('signature','Signature','pen-line')}${mediaCard('stamp','Cachet','stamp')}</div><div class="live-preview-label">${ico('move',14)} Aperçu en direct — glissez la signature ou le cachet à l’endroit voulu</div><div class="live-preview-wrap"><div class="live-stage" id="live-stage">${invoiceMarkup(previewSample(),true)}</div></div></div><div class="panel form-panel" style="margin-top:18px"><div class="panel-head"><div><h2 class="panel-title">Marges du document</h2><p class="muted">Ajustez la hauteur des marges supérieure et inférieure.</p></div></div><div class="invoice-margin-control"><label>Marge haute <input type="range" min="0" max="30" value="${s.marginTop??8}" data-margin="marginTop" style="width:120px"> <span id="marginTopVal">${s.marginTop??8}mm</span></label><label>Marge basse <input type="range" min="0" max="30" value="${s.marginBottom??8}" data-margin="marginBottom" style="width:120px"> <span id="marginBottomVal">${s.marginBottom??8}mm</span></label></div></div><div class="panel form-panel" style="margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap"><div><h2 class="panel-title">Données locales</h2><p class="muted">Sauvegardez ou réinitialisez vos données.</p></div><div style="display:flex;gap:8px"><button class="input" style="width:auto" data-backup>${ico('download',16)} Exporter JSON</button><button class="input" style="width:auto;color:#c33" data-reset>${ico('trash-2',16)} Réinitialiser</button></div></div></div>`}
function previewSample(){return state.invoices[0]||{type:'invoice',ref:'FACT WEDE-000000/1',date:new Date().toISOString().slice(0,10),client:'Client Exemple',address:'Adresse du client',email:'client@example.com',object:'Objet de la prestation',payment:'Paiement comptant',delay:'Délai à préciser',discount:'',validityDays:'',requiresValidation:false,items:[{designation:'Prestation exemple',qty:1,unit:100000}]}}
function updateMargin(e){const key=e.currentTarget.dataset.margin;const val=Number(e.currentTarget.value);state.settings[key]=val;const span=document.getElementById(key+'Val');if(span)span.textContent=val+'mm';const stage=document.getElementById('live-stage');const content=stage?.querySelector('.invoice-content');if(content)content.style[key==='marginTop'?'paddingTop':'paddingBottom']=val+'mm';persist();}
function editInvoice(id){editingId=id;page='create';persist();render()}
function removeInvoice(id){confirmBox('Supprimer cette facture ?').then(r=>{if(r.isConfirmed){state.invoices=state.invoices.filter(x=>x.id!==id);persist();notify('Facture supprimée');render()}})}
function spawnInvoiceFromProforma(p){const invoiceRef=(p.ref||'').replace(/^FACT PRO /,'FACT ');return {id:makeId(),type:'invoice',status:'validated',ref:invoiceRef,sourceProformaId:p.id,date:p.date,client:p.client,clientNumber:p.clientNumber||'',address:p.address||'',phone:p.phone||'',email:p.email||'',object:p.object,payment:p.payment||'',delay:p.delay||'',discount:p.discount||'',validityDays:'',requiresValidation:false,items:JSON.parse(JSON.stringify(p.items||[])),createdAt:new Date().toISOString()}}
function setStatus(status,id){const x=state.invoices.find(i=>i.id===id);if(!x)return;x.status=status;if(status==='validated'&&x.type==='proforma'&&!x.convertedToInvoiceId){const inv=spawnInvoiceFromProforma(x);state.invoices.unshift(inv);x.convertedToInvoiceId=inv.id;persist();notify('Pro forma validée : facture '+inv.ref+' générée — ajustez le montant si besoin');editingId=inv.id;page='create';persist();render();return}persist();notify(status==='validated'?'Facture validée':'Facture marquée négociée');render()}

/* ---------- Preview modal ---------- */
function buildDocPreviewModal(markupHtml,titleLabel,refText,clientText,onExport){const modal=document.createElement('div');modal.className='modal-backdrop';modal.dataset.previousOverflow=document.body.style.overflow||'';modal.innerHTML=`<div class="modal a4-preview-modal"><button type="button" class="icon-btn modal-close" aria-label="Fermer l’aperçu" title="Fermer">${ico('x',20)}</button><div class="a4-toolbar"><div><strong class="panel-title">${esc(titleLabel)}</strong><p class="muted">${esc(refText||'')} · ${esc(clientText||'')}</p></div></div><div class="a4-scroll"><div class="a4-fit-outer"><div class="a4-preview-paper">${markupHtml}</div></div></div><div class="a4-modal-actions"><button class="primary" data-a4-export>${ico('download',17)} Exporter PDF</button></div></div>`;const close=()=>{if(!modal.isConnected)return;modal.remove();if(!document.querySelector('.modal-backdrop'))document.body.style.overflow=modal.dataset.previousOverflow||''};document.body.style.overflow='hidden';document.body.appendChild(modal);modal.querySelector('.modal-close').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();close()});modal.querySelector('[data-a4-export]').addEventListener('click',e=>{e.stopPropagation();onExport()});modal.addEventListener('click',e=>{if(e.target===modal)close()});document.addEventListener('keydown',function onKey(e){if(e.key==='Escape'&&modal.isConnected){close();document.removeEventListener('keydown',onKey)}});if(Icons.createIcons)Icons.createIcons({root:modal});requestAnimationFrame(()=>fitPreviewPaper(modal.querySelector('.a4-preview-paper')));return modal}
function buildPreviewModal(x){buildDocPreviewModal(invoiceMarkup(x),'Aperçu de la facture',x.ref,x.client,()=>exportPdfData(x))}
function buildSlipPreviewModal(sVal){buildDocPreviewModal(bordereauMarkup(sVal),'Aperçu du bordereau',sVal.slipRef,sVal.client,()=>exportSlipPdfData(sVal))}
function showPreview(id){const x=state.invoices.find(i=>i.id===id);if(!x)return;buildPreviewModal(x)}
function showSlipPreview(id){const sVal=state.slips.find(s=>s.id===id);if(!sVal)return;buildSlipPreviewModal(sVal)}
function currentPreview(){const form=document.querySelector('#invoice-form');if(!form)return;const f=new FormData(form);const x={...Object.fromEntries(f.entries()),requiresValidation:f.get('requiresValidation')==='on',items:[...document.querySelectorAll('.line-item')].map(r=>({designation:r.querySelector('[name=designation]').value,qty:Number(r.querySelector('[name=qty]').value),unit:Number(r.querySelector('[name=unit]').value)}))};buildPreviewModal(x)}
function currentSlipPreview(){const form=document.querySelector('#slip-form');if(!form)return;const existing=editingSlipId?state.slips.find(s=>s.id===editingSlipId):null;buildSlipPreviewModal(buildSlipFromForm(form,existing))}
function fitPreviewPaper(paper){if(!paper)return;const outer=paper.parentElement;const scroll=outer?.parentElement;if(!outer||!scroll)return;const naturalWidth=paper.offsetWidth||210*3.7795;const naturalHeight=paper.offsetHeight||297*3.7795;const availWidth=Math.max(240,scroll.clientWidth-44);const scale=Math.min(1,availWidth/naturalWidth);paper.style.transformOrigin='top left';paper.style.transform='scale('+scale+')';outer.style.width=(naturalWidth*scale)+'px';outer.style.height=(naturalHeight*scale)+'px';}
function fitLiveStage(){const outer=document.getElementById('live-stage');if(!outer)return;const paper=outer.querySelector('.invoice-paper');if(!paper)return;const wrap=outer.parentElement;const naturalWidth=210*3.7795275591;const naturalHeight=297*3.7795275591;const availableWidth=Math.max(1,wrap.clientWidth);const scale=Math.min(1,availableWidth/naturalWidth);paper.style.transform='none';outer.style.transform='none';outer.style.zoom=scale;outer.style.width=naturalWidth+'px';outer.style.height=naturalHeight+'px';outer.style.margin='0';outer.style.transformOrigin='top left';wrap.style.width='100%';wrap.style.height=(naturalHeight*scale)+'px';wrap.style.minHeight='0';}
function fitMiniStage(){const stage=document.getElementById('mini-stage');if(!stage)return;const wrap=stage.parentElement;if(!wrap)return;stage.style.transform='none';const rect=stage.getBoundingClientRect();const availWidth=Math.max(1,wrap.clientWidth-24);const scale=Math.min(1,availWidth/Math.max(1,rect.width));stage.style.transformOrigin='top left';stage.style.transform='scale('+scale+')';wrap.style.height=Math.ceil(rect.height*scale)+'px';}
function collectInvoiceFormData(form){const f=new FormData(form);return {...Object.fromEntries(f.entries()),requiresValidation:f.get('requiresValidation')==='on',items:[...form.querySelectorAll('.line-item')].map(r=>({designation:r.querySelector('[name=designation]').value,qty:Number(r.querySelector('[name=qty]').value)||0,unit:Number(r.querySelector('[name=unit]').value)||0}))}}
function refreshMiniPreview(){const stage=document.getElementById('mini-stage');if(!stage)return;const invForm=document.querySelector('#invoice-form');const slipFormEl=document.querySelector('#slip-form');let html='';if(invForm)html=invoiceMarkup(collectInvoiceFormData(invForm));else if(slipFormEl)html=bordereauMarkup(buildSlipFromForm(slipFormEl,editingSlipId?state.slips.find(sV=>sV.id===editingSlipId):null));else return;stage.innerHTML=html;if(Icons.createIcons)Icons.createIcons({root:stage});fitMiniStage()}
let miniPreviewTimer=null;
function debounceMiniPreview(){clearTimeout(miniPreviewTimer);miniPreviewTimer=setTimeout(refreshMiniPreview,150)}
window.addEventListener('resize',()=>{document.querySelectorAll('.a4-preview-paper').forEach(fitPreviewPaper);if(page==='settings')fitLiveStage();if(page==='create'||page==='bordereau-form')fitMiniStage()});

/* ---------- Drag positioning (signature & cachet uniquement — le logo n'est plus déplaçable) ---------- */
function bindDragging(){const stage=document.getElementById('live-stage');if(!stage)return;stage.querySelectorAll('[data-drag-key]').forEach(el=>{el.onpointerdown=function(e){e.preventDefault();const key=el.dataset.dragKey;try{el.setPointerCapture(e.pointerId)}catch(err){}el.classList.add('dragging');function move(ev){const parent=el.offsetParent;if(!parent)return;const rect=parent.getBoundingClientRect();let px=((ev.clientX-rect.left)/rect.width)*100;let py=((ev.clientY-rect.top)/rect.height)*100;px=Math.max(-30,Math.min(130,px));py=Math.max(-30,Math.min(130,py));el.style.setProperty('--x',px.toFixed(1));el.style.setProperty('--y',py.toFixed(1));state.settings[key+'X']=Math.round(px);state.settings[key+'Y']=Math.round(py)}function up(ev){move(ev);el.onpointermove=null;el.onpointerup=null;el.classList.remove('dragging');persist();render()}el.onpointermove=move;el.onpointerup=up}})}
function updateMediaSetting(e){const key=e.currentTarget.dataset.mediaRange;const val=Number(e.currentTarget.value);state.settings[key]=val;const stage=document.getElementById('live-stage');if(stage){const dragKey=key.replace(/(X|Y|Size|Rotation)$/,'');const el=stage.querySelector('[data-drag-key="'+dragKey+'"]');if(el){if(key.endsWith('Size'))el.style.width=val+'mm';else if(key.endsWith('X'))el.style.setProperty('--x',val);else if(key.endsWith('Y'))el.style.setProperty('--y',val);else if(key.endsWith('Rotation'))el.style.setProperty('--r',val);}}persist()}
function clearImage(e){const key=e.currentTarget.dataset.clearImage;confirmBox('Supprimer cette image ?').then(r=>{if(r.isConfirmed){state.settings[key]='';persist();notify('Image supprimée');render()}})}
function resetMedia(e){const key=e.currentTarget.dataset.resetMedia;const defaults={signature:{X:50,Y:42,Size:34,Rotation:0},stamp:{X:50,Y:58,Size:30,Rotation:0}};const d=defaults[key]||{X:0,Y:0,Size:30,Rotation:0};state.settings[key+'X']=d.X;state.settings[key+'Y']=d.Y;state.settings[key+'Size']=d.Size;state.settings[key+'Rotation']=d.Rotation;persist();notify('Position réinitialisée');render()}
function readImage(e){const file=e.target.files?.[0],key=e.currentTarget.dataset.image;if(!file)return;const r=new FileReader();r.onload=()=>{state.settings[key]=r.result;persist();notify('Image enregistrée');render()};r.readAsDataURL(file)}
function saveSettings(e){e.preventDefault();const f=new FormData(e.currentTarget);state.settings={...state.settings,companyName:f.get('companyName'),title:f.get('title'),manager:f.get('manager'),phone:f.get('phone'),address:f.get('address'),email:f.get('email'),website:f.get('website'),paymentMethods:f.get('paymentMethods')};persist();notify('Paramètres enregistrés');render()}
function downloadBackup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='le-facturier-sauvegarde.json';a.click();notify('Sauvegarde téléchargée')}
function resetData(){confirmBox('Réinitialiser les données ?').then(r=>{if(r.isConfirmed){localStorage.removeItem(STORE);state=readStore();page='dashboard';persist();notify('Données réinitialisées');render()}})}

/* ---------- PDF export ---------- */
function pdfFilenameFor(ref,client){return `${(ref||'document').replace(/[^a-z0-9]/gi,'_')}_${(client||'client').replace(/[^a-z0-9]/gi,'_')}.pdf`}
function pdfFilename(x){return pdfFilenameFor(x.ref,x.client)}
function waitForImages(el){const imgs=[...el.querySelectorAll('img')];return Promise.all(imgs.map(img=>{if(img.complete&&img.naturalWidth>0)return Promise.resolve();return new Promise(res=>{img.onload=res;img.onerror=res;setTimeout(res,3000)})}))}
function makePdfFromMarkup(markupHtml,filename){const holder=document.createElement('div');holder.style.position='absolute';holder.style.left='0';holder.style.top='0';holder.style.opacity='1';holder.style.pointerEvents='none';holder.style.zIndex='-1';holder.style.width='210mm';holder.style.height='297mm';holder.innerHTML=markupHtml;document.body.appendChild(holder);if(Icons.createIcons)Icons.createIcons({root:holder});if(!window.html2pdf){notify('Bibliothèque PDF indisponible : impression du navigateur utilisée','warning');window.print();holder.remove();return Promise.resolve(null)}const paperEl=holder.
