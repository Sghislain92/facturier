<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123b85">
<meta name="description" content="Le Facturier — factures Websoft Enterprise, stockage local.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/images/icone.png">
<link rel="apple-touch-icon" href="/images/icone.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Le Facturier">
<title>Le Facturier</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--brand:#123b85;--blue:#168fd0;--orange:#ff6500;--ink:#10203d;--bg:#f4f7fb;--line:#e5eaf2}
*{box-sizing:border-box}
html,body,#app{margin:0;min-height:100%;width:100%;max-width:100%;overflow-x:hidden}
body{font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
h1,h2,h3,.display{font-family:'Plus Jakarta Sans',Inter,sans-serif}

/* ---------- Layout ---------- */
.app-shell{display:flex;min-height:100vh;width:100%}
.sidebar{position:fixed;inset:0 auto 0 0;width:245px;background:#fff;padding:20px;z-index:40;box-shadow:10px 0 35px #10234a0d}
.brand{display:flex;align-items:center;gap:11px;padding:0 3px;margin-bottom:42px}
.brand img{width:42px;height:42px;object-fit:contain}
.brand-name{font-weight:800;font-size:18px;letter-spacing:-.04em}
.brand-sub{font-size:9px;letter-spacing:.16em;color:#93a0b6;font-weight:800;text-transform:uppercase;margin-top:2px}
.side-nav{display:flex;flex-direction:column;gap:5px}
.nav-btn{width:100%;display:flex;align-items:center;gap:12px;padding:12px 13px;border-radius:12px;background:transparent;color:#1d2940;font-weight:700;font-size:13px;text-align:left;transition:.15s}
.nav-btn:hover,.nav-btn.active{background:#eaf1ff;color:var(--brand)}
.local-box{position:absolute;left:20px;right:20px;bottom:20px;padding:15px;border-radius:17px;background:linear-gradient(135deg,#123b85,#0b79c0);color:#fff;box-shadow:0 12px 26px #123b8530}
.local-box small{color:#cfe0ff;display:block;margin-bottom:5px}
.local-box strong{font-size:13px;line-height:1.35;display:block}
.workspace{width:calc(100% - 245px);margin-left:245px;min-width:0}
.topbar{height:80px;position:fixed;top:0;right:0;left:245px;z-index:30;background:#ffffffeb;backdrop-filter:blur(18px);border-bottom:1px solid #e8edf5;display:flex;align-items:center;justify-content:space-between;padding:0 40px}
.eyebrow{font-size:11px;color:var(--orange);font-weight:800;letter-spacing:.2em;text-transform:uppercase}
.page-heading{font-weight:800;font-size:25px;letter-spacing:-.05em;margin:3px 0 0}
.main{padding:112px 40px 40px;width:100%;max-width:1500px;min-width:0}
.mobile-menu-btn{display:none}

/* ---------- Hero / stats ---------- */
.hero{position:relative;overflow:hidden;border-radius:27px;padding:42px 40px;background:linear-gradient(120deg,#102f70,#123b85 55%,#0c80bd);color:#fff;min-height:300px;box-shadow:0 18px 45px #123b852b}
.hero-copy{position:relative;z-index:2;max-width:650px}
.hero h2{font-size:48px;line-height:1.05;margin:10px 0 16px;letter-spacing:-.06em}
.hero p{max-width:530px;line-height:1.65;color:#dbeaff;margin:0}
.hero:after{content:'';position:absolute;width:400px;height:400px;border:42px solid #ffffff18;border-radius:50%;right:-75px;bottom:-185px}
.hero-dot{position:absolute;right:95px;top:34px;width:13px;height:13px;border-radius:50%;background:var(--orange);box-shadow:0 0 28px 10px #ff650060}
.primary{display:inline-flex;align-items:center;gap:8px;background:var(--brand);color:#fff;padding:12px 17px;border-radius:12px;font-size:13px;font-weight:800;box-shadow:0 10px 22px #123b8526;transition:.15s}
.hero .primary{background:#fff;color:var(--brand);margin-top:25px}
.primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.stats-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:32px}
.stat-card,.panel{background:#ffffffd9;border:1px solid #e5eaf250;border-radius:18px;box-shadow:0 15px 40px #10234a0b}
.stat-card{padding:19px;min-width:0}
.stat-label{font-size:11px;color:#94a0b4;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.stat-value{font-family:'Plus Jakarta Sans';font-size:25px;font-weight:800;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-sub{font-size:11px;color:#748096;margin-top:4px}
.bottom-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(260px,.65fr);gap:20px;margin-top:20px;min-width:0}
.panel{padding:20px;min-width:0}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:13px}
.panel-title{font-size:18px;font-weight:800;margin:0}
.muted{color:#748096;font-size:12px;margin:5px 0 0}
.recent-row{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid #edf0f5;padding:13px 0;min-width:0;cursor:pointer;transition:.15s;border-radius:10px}
.recent-row:hover{background:#f6f9ff}
.recent-main{display:flex;align-items:center;gap:11px;min-width:0}
.recent-main>div:last-child{min-width:0}
.recent-name{font-size:13px;font-weight:800}
.recent-meta{font-size:11px;color:#94a0b4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shortcut-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.shortcut{padding:16px;border-radius:15px;background:#edf4ff;color:var(--brand);text-align:left;font-weight:800;font-size:12px;min-width:0;transition:.15s}
.shortcut:hover{transform:translateY(-2px);box-shadow:0 10px 20px #123b8520}
.shortcut.orange{background:#fff2e8;color:var(--orange)}

/* ---------- Lists / filters ---------- */
.section-title{font-size:30px;font-weight:800;letter-spacing:-.05em;margin:4px 0}
.page-actions{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px}
.filters{display:grid;grid-template-columns:minmax(0,1fr) 150px 150px 160px;gap:10px;padding:14px;margin-bottom:17px}
.field{display:block;min-width:0}
.field span{display:block;font-size:11px;font-weight:800;color:#68758b;margin-bottom:7px}
.field input,.field select,.input{height:43px;width:100%;border:1px solid #dfe5ee;border-radius:11px;background:#fff;color:var(--ink);padding:0 12px;outline:none;transition:.15s}
.field input:focus,.field select:focus,.input:focus{border-color:#83a5df;box-shadow:0 0 0 4px #d9e6ff}
.list-head,.list-row{display:grid;grid-template-columns:minmax(180px,1.4fr) minmax(130px,1fr) minmax(150px,1.2fr) 110px 120px 180px;gap:14px;align-items:center;padding:14px 18px;min-width:0}
.list-head{background:#f7f9fc;color:#95a0b2;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.list-row{border-top:1px solid #edf0f5;cursor:pointer;transition:.15s}
.list-row:hover{background:#f6f9ff}
.client-cell{display:flex;align-items:center;gap:9px;min-width:0}
.client-cell>div:last-child{min-width:0}
.client-name{font-weight:800;font-size:13px}
.client-mail,.truncate{font-size:11px;color:#93a0b4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-actions{display:flex;justify-content:flex-end;gap:4px}
.icon-btn{width:32px;height:32px;border-radius:9px;background:transparent;color:#7e8aa0;display:inline-flex;align-items:center;justify-content:center;transition:.15s}
.icon-btn:hover{background:#edf4ff;color:var(--brand)}
.status{display:inline-flex;width:max-content;max-width:100%;padding:5px 8px;border-radius:99px;font-size:10px;font-weight:800}
.pending{background:#fff5d8;color:#a36b00}
.negotiated{background:#fff0e5;color:#d95d00}
.validated{background:#e7f8ee;color:#19834b}

/* ---------- Editor ---------- */
.editor-grid{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:22px;align-items:start}
.form-panel{padding:24px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.full{grid-column:1/-1}
.line-list{display:flex;flex-direction:column;gap:10px}
.line-item{display:grid;grid-template-columns:minmax(0,1fr) 75px 125px 38px;gap:8px;align-items:end}
.line-item .field span{font-size:10px}
.line-item input{height:40px}
.preview-sticky{position:sticky;top:100px;min-width:0}
.mini-wrap{background:#dfe5ee;padding:12px;border-radius:16px;overflow:hidden}
.mini-scale{width:192%;height:520px;transform:scale(.52);transform-origin:top left;pointer-events:none}

/* ---------- Invoice document ---------- */
.invoice-brand-head{display:grid;grid-template-columns:33% 67%;align-items:center;gap:8mm;margin-bottom:4mm;min-height:28mm}
.invoice-brand-left{position:relative;height:28mm;overflow:visible;display:flex;align-items:center;justify-content:center}
.invoice-brand-logo{position:absolute;height:auto;object-fit:contain;top:50%;left:50%;transform:translate(-50%,-50%)}
.invoice-brand-right{color:#3659a8;font-weight:700;font-size:10px;line-height:1.5}
.invoice-body{flex:1 1 auto}
.invoice-brand-foot{margin-top:auto;padding-top:6mm;font-family:Arial,sans-serif}
.invoice-foot-bars{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;height:5px;margin-bottom:5mm;border-radius:3px;overflow:hidden}
.invoice-foot-bars span:nth-child(1){background:#3659a8}
.invoice-foot-bars span:nth-child(2){background:#ff6500}
.invoice-foot-bars span:nth-child(3){background:#1198dc}
.invoice-foot-panel{background:#f5f8fc;border-radius:10px;padding:5mm 6mm;display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:4mm}
.invoice-foot-panel div{display:flex;align-items:center;gap:2.5mm;font-size:9px;font-weight:700;color:#28324a;line-height:1.4}
.invoice-foot-icon{width:7mm;height:7mm;min-width:7mm;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.invoice-foot-legal{text-align:center;font-size:8.5px;line-height:1.7;margin-top:4mm;color:#5b6785;font-weight:600}
.invoice-foot-legal b{color:#3659a8}
.invoice-paper{display:flex;flex-direction:column;width:210mm;min-height:297mm;background:#fff;color:#111;padding:8mm 14mm 8mm;font-family:Arial,sans-serif;margin:0 auto}
.invoice-meta{display:grid;grid-template-columns:1fr 1fr;gap:10mm;margin-top:3mm}
.invoice-label{background:#3659a8;color:#fff;text-align:center;font-weight:700;padding:6px;font-size:12px;border-radius:4px}
.invoice-small{font-size:11px;font-family:Arial,sans-serif}
.invoice-small span{font-weight:800}
.invoice-small p{margin:0 0 7px}
.invoice-orange{color:#ec8125}
.invoice-table{border-collapse:collapse;width:100%;font-size:11px}
.invoice-table th,.invoice-table td{border:1px solid #111;padding:8px 7px}
.invoice-table th{background:#f4f4f4;text-align:center}
.invoice-table td:not(:nth-child(2)){text-align:center}
.invoice-sign-area{position:relative;min-height:30mm;text-align:center;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.invoice-sign-area .sign-text{position:relative;z-index:2}
.invoice-signature,.invoice-stamp{position:absolute;object-fit:contain;margin:0;max-width:none;max-height:none;display:block;z-index:1}
.invoice-margin-control{display:flex;gap:15px;margin:10px 0 15px;flex-wrap:wrap}
.invoice-margin-control label{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:#5b6785}

/* ---------- Draggable elements ---------- */
[data-drag-key]{cursor:grab;touch-action:none}
[data-drag-key].dragging{cursor:grabbing;outline:2px dashed #168fd0;outline-offset:3px;filter:drop-shadow(0 4px 10px #168fd066)}

/* ---------- Media cards ---------- */
.media-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}
.media-card{border:1px solid #e3e9f2;border-radius:16px;padding:15px;background:#fbfcfe}
.media-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.media-card-actions{display:flex;gap:4px;flex:none}
.upload-zone{display:block;border:1.5px dashed #b8c8df;border-radius:13px;padding:17px;text-align:center;background:#f7faff;color:#56708f;transition:.18s;margin-top:10px;position:relative;overflow:hidden}
.upload-zone:hover{border-color:#168fd0;background:#edf7ff}
.upload-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.media-thumb{height:80px;width:100%;object-fit:contain;background:#fff;border-radius:10px;border:1px solid #edf0f5}
.media-controls{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}
.media-controls label{font-size:10px;color:#68758b;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:8px}
.media-controls input[type=range]{width:100%;accent-color:#123b85}
.live-preview-label{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:#5b6785;margin:20px 0 8px}
.live-preview-wrap{background:#dfe5ee;padding:14px;border-radius:16px;overflow:auto;display:flex;justify-content:center}
.live-stage{margin:0 auto;display:flex;justify-content:center}

/* ---------- A4 preview modals ---------- */
.modal-backdrop{position:fixed;inset:0;z-index:80;background:#08152e99;display:flex;align-items:center;justify-content:center;padding:20px}
.a4-preview-modal{width:min(1120px,100%);height:min(94vh,980px);display:flex;flex-direction:column}
.a4-toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;flex:none;padding-bottom:12px;border-bottom:1px solid #edf0f5}
.a4-scroll{overflow:auto;flex:1;background:#dfe5ee;padding:22px;display:flex;justify-content:center;align-items:flex-start}
.a4-fit-outer{margin:0 auto;display:flex;justify-content:center;align-items:flex-start;width:100%}
.a4-preview-paper{box-shadow:0 12px 40px #10234a20;flex-shrink:0;margin:0 auto}
.modal{width:min(920px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:18px;box-shadow:0 30px 80px #0004}
.modal-close{float:right}
.hidden{display:none!important}

/* ---------- Install banner ---------- */
.install-banner{background:linear-gradient(135deg,#123b85,#0b79c0);color:#fff;padding:14px 24px;border-radius:14px;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;margin-bottom:20px;box-shadow:0 8px 25px #123b8530}
.install-banner .install-text{font-weight:600;font-size:14px;display:flex;align-items:center;gap:10px}
.install-banner .install-text svg{flex-shrink:0}
.install-banner .install-actions{display:flex;gap:8px}
.install-banner .install-actions button{padding:8px 16px;border-radius:10px;font-weight:700;font-size:12px;transition:.15s}
.install-banner .install-actions .btn-install{background:#fff;color:#123b85}
.install-banner .install-actions .btn-install:hover{transform:scale(1.03)}
.install-banner .install-actions .btn-dismiss{background:rgba(255,255,255,.2);color:#fff}
.install-banner .install-actions .btn-dismiss:hover{background:rgba(255,255,255,.3)}

@media(max-width:1100px){.stats-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.bottom-grid{grid-template-columns:minmax(0,1fr)}.editor-grid{grid-template-columns:minmax(0,1fr)}.preview-sticky{position:static;max-width:640px}}
@media(max-width:800px){
  .media-cards{grid-template-columns:minmax(0,1fr)}
  .sidebar{display:none}
  .workspace{width:100%;margin-left:0}
  .topbar{left:0;height:72px;padding:0 18px}
  .main{padding:96px 16px 94px}
  .mobile-menu-btn{display:inline-flex;width:42px;height:42px;border-radius:12px;background:#f1f4f8;align-items:center;justify-content:center}
  .hero{padding:30px 25px;min-height:325px}
  .hero h2{font-size:35px}
  .hero:after{width:280px;height:280px;right:-100px;bottom:-150px}
  .stats-grid{gap:12px;margin-top:20px}
  .stat-card{padding:15px}
  .stat-value{font-size:20px}
  .list-head{display:none}
  .list-row{display:flex;flex-wrap:wrap;padding:15px;gap:10px}
  .list-row>div:nth-child(1){width:calc(100% - 0px)}
  .list-row>div:nth-child(2),.list-row>div:nth-child(3),.list-row>div:nth-child(4),.list-row>div:nth-child(5){width:calc(50% - 6px)}
  .list-actions{width:100%;justify-content:flex-start}
  .filters{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .filters .search-field{grid-column:1/-1}
  .form-grid{grid-template-columns:minmax(0,1fr)}
  .full{grid-column:auto}
  .line-item{grid-template-columns:minmax(0,1fr) 62px 96px 38px}
  .bottom-grid{gap:12px}
  .a4-scroll{padding:12px}
  .a4-toolbar{flex-wrap:wrap;gap:10px}
  .a4-toolbar .primary{flex:1;justify-content:center}
  .mobile-bottom{position:fixed;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));bottom:0;left:0;right:0;height:74px;background:#fffffff5;backdrop-filter:blur(18px);border-top:1px solid #e8edf5;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
  .mobile-nav{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#8995aa;font-size:10px;font-weight:800}
  .mobile-nav.active{color:var(--brand)}
  .mobile-nav svg{width:20px;height:20px}
  .drawer{position:fixed;display:block;inset:0;z-index:70;pointer-events:none}
  .drawer.open{pointer-events:auto}
  .drawer-shade{position:absolute;inset:0;background:#09152e66;opacity:0;transition:opacity .2s}
  .drawer.open .drawer-shade{opacity:1}
  .drawer-panel{position:absolute;right:0;top:0;bottom:0;width:95%;max-width:380px;background:#fff;padding:22px;transform:translateX(100%);transition:transform .22s ease-out;box-shadow:-20px 0 50px #0002}
  .drawer.open .drawer-panel{transform:translateX(0)}
  .drawer .side-nav{margin-top:35px}
  .drawer .local-box{position:absolute}
  .page-actions{align-items:flex-start;flex-direction:column}
  .page-actions .primary{width:100%;justify-content:center}
  .install-banner{flex-direction:column;text-align:center;padding:16px}
  .install-banner .install-actions{width:100%;justify-content:center}
}
@media print{.no-print{display:none!important}.invoice-paper{margin:0;box-shadow:none}.modal-backdrop{position:static;padding:0}}
</style>
</head>
<body><div id="app"></div>
<script>
(function(){
'use strict';
const ASSETS={logo:'/images/icone.png'};
const STORE='le-facturier-v2';
const fallbackIcons={createIcons:function(){document.querySelectorAll('[data-lucide]').forEach(function(e){if(!e.innerHTML)e.innerHTML='•'})}};
const Icons=window.lucide||fallbackIcons;
const makeId=()=>window.crypto&&crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);
const baseSettings={companyName:'Websoft Enterprise Digital Engineering SARL',manager:'Yaovi Ghislain SIATE',title:'Gérant',logo:'',logoSize:42,logoX:0,logoY:0,signatureX:50,signatureY:42,signatureSize:34,stampX:50,stampY:58,stampSize:30,marginTop:8,marginBottom:8,phone:'+229 01 97 83 23 90 / +229 01 95 36 65 65',email:'contact@websoftenterprise.com',website:'www.websoftenterprise.com',address:'Dowa, Porto-Novo, Bénin',signature:'',stamp:''};
const mediaRanges={logo:{size:[20,80],x:[0,60],y:[0,60]},signature:{size:[15,70],x:[0,90],y:[0,85]},stamp:{size:[15,70],x:[0,90],y:[0,85]}};
const seed={id:makeId(),type:'proforma',status:'pending',ref:'FACT PRO WEDE-202609/123',date:'2026-09-01',client:'Res\'AU',address:'Lomé, Togo',email:'infos.resau@gmail.com',object:'Renouvellement de l\'hébergement web',payment:'Paiement comptant',delay:'6h après réception du paiement',items:[{designation:'Renouvellement de l\'hébergement web (12 mois)',qty:1,unit:100000},{designation:'Configuration et frais agence',qty:1,unit:25000}],createdAt:new Date().toISOString()};
function readStore(){try{const raw=localStorage.getItem(STORE);if(raw)return JSON.parse(raw)}catch(e){}const initial={invoices:[seed],settings:{...baseSettings},page:'dashboard'};localStorage.setItem(STORE,JSON.stringify(initial));return initial}
let state=readStore();state.settings={...baseSettings,...(state.settings||{})};let page=state.page||'dashboard', editingId=null, filters={q:'',from:'',to:'',sort:'date-desc'};
function persist(){state.page=page;localStorage.setItem(STORE,JSON.stringify(state));window.dispatchEvent(new CustomEvent('facturier:updated'))}
window.addEventListener('storage',function(e){if(e.key===STORE){state=readStore();page=state.page||'dashboard';render()}});
window.addEventListener('facturier:updated',function(){if(!document.querySelector(':focus'))render()});
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=n=>new Intl.NumberFormat('fr-FR').format(Number(n)||0);
const dateFr=d=>d?new Date(d+'T00:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'}):'';
const total=x=>(x.items||[]).reduce((a,i)=>a+(Number(i.qty)||0)*(Number(i.unit)||0),0);
const ico=(n,s=18)=>`<i data-lucide="${n}" width="${s}" height="${s}"></i>`;
function notify(title,type='success'){if(window.Swal&&typeof Swal.fire==='function'){Swal.fire({toast:true,position:'top-end',showConfirmButton:false,timer:2200,icon:type,title})}else{const n=document.createElement('div');n.className='fixed top-4 right-4 z-[100] bg-slate-900 text-white px-4 py-3 rounded-xl text-sm font-bold';n.textContent=title;document.body.appendChild(n);setTimeout(()=>n.remove(),2200)}}
function confirmBox(title){if(window.Swal&&typeof Swal.fire==='function')return Swal.fire({title,text:'Cette action est irréversible.',icon:'warning',showCancelButton:true,confirmButtonColor:'#123b85',confirmButtonText:'Confirmer',cancelButtonText:'Annuler'});return Promise.resolve({isConfirmed:window.confirm(title)})}
function refNext(type){const prefix=type==='proforma'?'FACT PRO WEDE-':'FACT WEDE-';const ym=new Date().toISOString().slice(0,7).replace('-','');const nums=state.invoices.filter(x=>(x.type||'invoice')===type).map(x=>Number(String(x.ref||'').split('/').pop())).filter(Boolean);const n=Math.max(type==='invoice'?123:0,...nums)+1;return prefix+ym+'/'+n}
function getTypeLabel(type){return type==='proforma'?'FACTURE PROFORMA':'FACTURE'}
function navButton(id,label,icon){return `<button class="nav-btn ${page===id?'active':''}" data-nav="${id}">${ico(icon,18)}<span>${label}</span></button>`}
function mobileNav(id,label,icon){return `<button class="mobile-nav ${page===id?'active':''}" data-nav="${id}">${ico(icon,20)}<span>${label}</span></button>`}
function layout(content){const installVisible=state.settings.installDismissed!==true && !window.navigator?.standalone;const installBanner=installVisible?`<div class="install-banner"><div class="install-text">${ico('download-cloud',22)} Installez Le Facturier sur votre appareil</div><div class="install-actions"><button class="btn-install" data-action="install-app">Installer</button><button class="btn-dismiss" data-action="dismiss-install">Plus tard</button></div></div>`:'';return `<div class="app-shell"><aside class="sidebar"><div class="brand"><img src="${ASSETS.logo}"><div><div class="brand-name">Le Facturier</div><div class="brand-sub">Websoft Enterprise</div></div></div><nav class="side-nav">${navButton('dashboard','Accueil','layout-dashboard')}${navButton('create','Créer facture','file-plus-2')}${navButton('invoices','Mes factures','files')}${navButton('history','Historique','history')}${navButton('settings','Paramètres','settings')}${installVisible?navButton('install','Installer Facturier','download-cloud'):''}</nav><div class="local-box"><small>Stockage local</small><strong>Vos données restent ici</strong><small style="margin-top:8px">Aucune base externe utilisée.</small></div></aside><section class="workspace"><header class="topbar"><div><div class="eyebrow">Espace de gestion</div><h1 class="page-heading">${title()}</h1></div><div style="display:flex;align-items:center;gap:10px"><button class="mobile-menu-btn" data-action="drawer-open">${ico('menu',21)}</button></div></header><main class="main">${installBanner}${content}</main></section><div class="drawer" id="drawer"><div class="drawer-shade" data-action="drawer-close"></div><aside class="drawer-panel"><div style="display:flex;justify-content:space-between;align-items:center"><div class="brand" style="margin:0"><img src="${ASSETS.logo}"><div><div class="brand-name">Le Facturier</div><div class="brand-sub">Menu</div></div></div><button class="icon-btn" data-action="drawer-close">${ico('x',20)}</button></div><nav class="side-nav">${navButton('dashboard','Accueil','layout-dashboard')}${navButton('create','Créer facture','file-plus-2')}${navButton('invoices','Mes factures','files')}${navButton('history','Historique','history')}${navButton('settings','Paramètres','settings')}${installVisible?navButton('install','Installer Facturier','download-cloud'):''}</nav></aside></div><nav class="mobile-bottom">${mobileNav('dashboard','Accueil','house')}${mobileNav('create','Créer','plus-square')}${mobileNav('history','Historique','history')}${mobileNav('settings','Paramètres','settings')}</nav></div>`}
function title(){return {dashboard:'Vue d\'ensemble',create:editingId?'Modifier la facture':'Nouvelle facture',invoices:'Mes factures',history:'Historique des créations',settings:'Paramètres'}[page]}
function render(){document.getElementById('app').innerHTML=layout(page==='dashboard'?dashboard():page==='create'?editor():page==='settings'?settings():list(page==='history'));if(Icons.createIcons)Icons.createIcons();bindEvents();if(page==='settings')requestAnimationFrame(fitLiveStage)}
function bindEvents(){
  document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.nav)));
  document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',handleAction));
  document.querySelectorAll('[data-filter]').forEach(e=>e.addEventListener(e.tagName==='SELECT'||e.type==='date'?'change':'input',()=>{filters[e.dataset.filter]=e.value;render()}));
  const form=document.querySelector('#invoice-form');if(form)form.addEventListener('submit',saveInvoice);
  document.querySelectorAll('[data-line-action]').forEach(b=>b.addEventListener('click',lineAction));
  document.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>editInvoice(b.dataset.edit)));
  document.querySelectorAll('[data-preview]').forEach(b=>b.addEventListener('click',()=>showPreview(b.dataset.preview)));
  document.querySelectorAll('[data-pdf]').forEach(b=>b.addEventListener('click',()=>exportPdf(b.dataset.pdf)));
  document.querySelectorAll('[data-delete]').forEach(b=>b.addEventListener('click',()=>removeInvoice(b.dataset.delete)));
  document.querySelectorAll('[data-status]').forEach(b=>b.addEventListener('click',()=>setStatus(b.dataset.status,b.dataset.id)));
  document.querySelectorAll('[data-convert]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();confirmConversion(b.dataset.convert)}));
  document.querySelectorAll('[data-image]').forEach(e=>e.addEventListener('change',readImage));
  document.querySelectorAll('[data-media-range]').forEach(e=>e.addEventListener('input',updateMediaSetting));
  document.querySelectorAll('[data-clear-image]').forEach(e=>e.addEventListener('click',clearImage));
  document.querySelectorAll('[data-reset-media]').forEach(e=>e.addEventListener('click',resetMedia));
  document.querySelectorAll('[data-margin]').forEach(e=>e.addEventListener('input',updateMargin));
  bindDragging();
  const settingsForm=document.querySelector('#settings-form');if(settingsForm)settingsForm.addEventListener('submit',saveSettings);
  const backup=document.querySelector('[data-backup]');if(backup)backup.addEventListener('click',downloadBackup);
  const reset=document.querySelector('[data-reset]');if(reset)reset.addEventListener('click',resetData);
}
function navigate(p){if(p==='install'){triggerInstall();return;}page=p;editingId=null;persist();render();window.scrollTo({top:0,behavior:'smooth'});closeDrawer()}
function handleAction(e){const a=e.currentTarget.dataset.action;if(a==='drawer-open')document.getElementById('drawer').classList.add('open');if(a==='drawer-close')closeDrawer();if(a==='preview-current')currentPreview();if(a==='install-app')triggerInstall();if(a==='dismiss-install'){state.settings.installDismissed=true;persist();render();}}
function closeDrawer(){document.getElementById('drawer')?.classList.remove('open')}
function triggerInstall(){if(window.navigator?.standalone){notify('L\'application est déjà installée','info');return}if(window.deferredPrompt){window.deferredPrompt.prompt();window.deferredPrompt.userChoice.then(res=>{if(res.outcome==='accepted'){state.settings.installDismissed=true;persist();render();notify('Installation lancée !')}else{notify('Installation annulée','info')}window.deferredPrompt=null});}else{notify('Ouvrez ce site dans Chrome et utilisez "Ajouter à l\'écran d\'accueil"','info')}}
function stat(label,value,sub,icon,color){return `<div class="stat-card"><div style="display:flex;justify-content:space-between;gap:8px"><div style="min-width:0"><div class="stat-label">${label}</div><div class="stat-value">${value}</div><div class="stat-sub">${sub}</div></div><div class="rounded-xl p-2.5 ${color}">${ico(icon,19)}</div></div></div>`}
function dashboard(){const totalAll=state.invoices.reduce((a,x)=>a+total(x),0),clients=new Set(state.invoices.map(x=>(x.client||'').toLowerCase())).size,month=state.invoices.filter(x=>x.date?.slice(0,7)===new Date().toISOString().slice(0,7)).length;return `<section class="hero"><div class="hero-dot"></div><div class="hero-copy"><div class="eyebrow" style="color:#bcd6ff">Votre atelier de facturation</div><h2>Facturez avec la signature Websoft.</h2><p>Un espace simple, rapide et entièrement local pour piloter vos documents Websoft Enterprise.</p><button class="primary" data-nav="create">${ico('file-plus-2',18)} Commencer une facture</button></div></section><section class="stats-grid">${stat('Factures créées',state.invoices.length,'dans votre espace','files','bg-blue-50 text-blue-800')}${stat('Chiffre d\'affaires',money(totalAll)+' FCFA','total HT cumulé','banknote','bg-orange-50 text-orange-600')}${stat('Clients uniques',clients,'depuis le début','users','bg-cyan-50 text-cyan-700')}${stat('Ce mois-ci',month,'factures datées du mois','calendar-days','bg-emerald-50 text-emerald-700')}</section><section class="bottom-grid"><div class="panel"><div class="panel-head"><div><h2 class="panel-title">Dernières factures</h2><p class="muted">Vos documents les plus récents</p></div><button class="text-blue-800 text-sm font-bold" data-nav="invoices">Tout voir →</button></div>${state.invoices.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,5).map(recent).join('')||'<p class="muted">Aucune facture</p>'}</div><div class="panel"><h2 class="panel-title">Raccourcis</h2><div class="shortcut-grid" style="margin-top:18px"><button class="shortcut" data-nav="create">${ico('plus',22)}<br><span>Nouvelle facture</span></button><button class="shortcut orange" data-nav="settings">${ico('stamp',22)}<br><span>Mon cachet</span></button></div></div></section>`}
function recent(x){return `<div class="recent-row" data-preview="${x.id}"><div class="recent-main"><div class="rounded-xl bg-blue-50 text-blue-800 p-2">${ico('file-text',17)}</div><div><div class="recent-name">${esc(x.client||'Client')}</div><div class="recent-meta">${esc(x.ref)} · ${dateFr(x.date)}</div></div></div><strong>${money(total(x))}<small style="display:block;color:#94a0b4;text-align:right;font-size:10px">FCFA</small></strong></div>`}
function input(label,name,value,type='text',extra=''){return `<label class="field"><span>${label}</span><input class="input" name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`}
function editor(){const x=editingId?state.invoices.find(i=>i.id===editingId):{type:'invoice',status:'pending',ref:refNext('invoice'),date:new Date().toISOString().slice(0,10),client:'',address:'',email:'',object:'',payment:'Paiement comptant',delay:'6h après réception du paiement',items:[{designation:'',qty:1,unit:0}]};return `<form id="invoice-form" class="editor-grid"><div style="min-width:0"><section class="panel form-panel"><div class="panel-head"><div><h2 class="panel-title">Informations de la facture</h2><p class="muted">Toutes les données sont conservées dans localStorage.</p></div><span class="status negotiated">Étape 01</span></div><div class="form-grid"><label class="field"><span>Type de document</span><select class="input" name="type" data-type-select><option value="invoice" ${x.type!=='proforma'?'selected':''}>Facture</option><option value="proforma" ${x.type==='proforma'?'selected':''}>Facture pro forma</option></select></label>${input('Référence','ref',x.ref)}${input('Date d\'émission','date',x.date,'date')}${input('Nom du client','client',x.client)}${input('Adresse','address',x.address)}${input('E-mail','email',x.email,'email')}<div class="full">${input('Objet de la prestation','object',x.object)}</div></div></section><section class="panel form-panel" style="margin-top:18px"><div class="panel-head"><div><h2 class="panel-title">Désignations</h2><p class="muted">Ajoutez autant de lignes que nécessaire.</p></div><button type="button" class="primary" data-line-action="add">${ico('plus',16)} Ajouter une ligne</button></div><div class="line-list" id="line-list">${x.items.map(line).join('')}</div><div style="display:flex;justify-content:flex-end;margin-top:18px"><div style="text-align:right"><div class="muted">Total HT</div><strong id="editor-total" style="font-size:25px;color:var(--brand)">${money(total(x))} FCFA</strong></div></div></section><section class="panel form-panel" style="margin-top:18px"><div class="form-grid">${input('Modalités de paiement','payment',x.payment)}${input('Délai d\'exécution','delay',x.delay)}</div></section><div style="display:flex;gap:10px;margin-top:18px"><button type="button" class="input" style="width:auto;padding:0 18px;font-weight:800" data-nav="invoices">Annuler</button><button type="submit" class="primary">${ico('save',17)} Enregistrer la facture</button></div></div><aside class="preview-sticky"><div class="panel-head"><strong>Aperçu rapide</strong><span class="muted">A4 · prêt à exporter</span></div><div class="mini-wrap"><div class="mini-scale">${invoiceMarkup(x)}</div></div><button type="button" class="input" style="margin-top:10px;font-weight:800" data-action="preview-current">${ico('eye',17)} Voir l\'aperçu complet</button></aside></form>`}
function line(i){return `<div class="line-item"><label class="field"><span>Désignation</span><input class="input" name="designation" value="${esc(i.designation)}"></label><label class="field"><span>Qté</span><input class="input" name="qty" type="number" min="0" step="1" value="${i.qty}"></label><label class="field"><span>Prix unitaire</span><input class="input" name="unit" type="number" min="0" step="1" value="${i.unit}"></label><button type="button" class="icon-btn" data-line-action="remove">${ico('trash-2',17)}</button></div>`}
function lineAction(e){if(e.currentTarget.dataset.lineAction==='add'){document.getElementById('line-list').insertAdjacentHTML('beforeend',line({designation:'',qty:1,unit:0}));bindEvents();Icons.createIcons()}else{e.currentTarget.closest('.line-item').remove();updateEditorTotal()}}
function updateEditorTotal(){const t=[...document.querySelectorAll('.line-item')].reduce((a,r)=>a+(Number(r.querySelector('[name=qty]').value)||0)*(Number(r.querySelector('[name=unit]').value)||0),0);const out=document.getElementById('editor-total');if(out)out.textContent=money(t)+' FCFA'}
function saveInvoice(e){e.preventDefault();const f=new FormData(e.currentTarget),type=f.get('type')||'invoice';const items=[...document.querySelectorAll('.line-item')].map(r=>({designation:r.querySelector('[name=designation]').value,qty:Number(r.querySelector('[name=qty]').value)||0,unit:Number(r.querySelector('[name=unit]').value)||0})).filter(i=>i.designation||i.unit);if(!f.get('client')||!items.length){notify('Client et désignation requis','warning');return}const old=editingId?state.invoices.find(i=>i.id===editingId):null;const x={id:old?.id||makeId(),type,status:old?.status||'pending',ref:old?.ref||refNext(type),date:f.get('date'),client:f.get('client'),address:f.get('address'),email:f.get('email'),object:f.get('object'),payment:f.get('payment'),delay:f.get('delay'),items,createdAt:old?.createdAt||new Date().toISOString()};const idx=state.invoices.findIndex(i=>i.id===x.id);if(idx>=0)state.invoices[idx]=x;else state.invoices.unshift(x);persist();notify(idx>=0?'Facture mise à jour':'Facture enregistrée');page='invoices';editingId=null;persist();render();setTimeout(()=>offerPdf(x.id),120)}

function invoiceHeader(editable){const s=state.settings;const dk=editable?' data-drag-key="logo"':'';return `<div class="invoice-brand-head"><div class="invoice-brand-left"><img src="${s.logo||ASSETS.logo}" class="invoice-brand-logo"${dk} style="width:${Number(s.logoSize)||42}mm"></div><div class="invoice-brand-right">Développement de site web, d’applications web & mobiles, Solutions SaaS et Cloud, Intégration de solutions de paiement, Solutions de cybersécurité, Communication digitale, Formation & assistance IT</div></div>`}
function invoiceFooter(){return `<div class="invoice-brand-foot"><div class="invoice-foot-bars"><span></span><span></span><span></span></div><div class="invoice-foot-panel"><div><span class="invoice-foot-icon" style="background:#3659a8">${ico('phone',13)}</span><span>+229 01 97 83 23 90<br>+229 01 95 36 65 65</span></div><div><span class="invoice-foot-icon" style="background:#ff6500">${ico('globe',13)}</span><span>www.websoftenterprise.com<br>contact@websoftenterprise.com</span></div><div><span class="invoice-foot-icon" style="background:#1198dc">${ico('house',13)}</span><span>Dowa<br>Porto-Novo, Bénin</span></div></div><div class="invoice-foot-legal"><b>Websoft Enterprise Digital Engineering SARL</b> au Capital social de 3.300.000 FCFA · N° RCCM RB/ABC/25 B 9290<br>IFU: 3202521113042 · Compte Bancaire CORIS BANK INTERNATIONAL: BJ66 BJ21 2030 0500 5389 1241 0125<br>Porto-Novo – Bénin</div></div>`}
function invoiceMarkup(x,editable){const s=state.settings;const dk=k=>editable?` data-drag-key="${k}"`:'';const typeLabel=getTypeLabel(x.type);const marginTop=Number(s.marginTop)||8;const marginBottom=Number(s.marginBottom)||8;const titleText=s.title?esc(s.title):'';return `<div class="invoice-paper" style="padding-top:${marginTop}mm;padding-bottom:${marginBottom}mm">${invoiceHeader(editable)}<div class="invoice-body"><div class="invoice-meta"><div><div class="invoice-label">${typeLabel}</div><div class="invoice-small" style="margin-top:8mm"><p><span class="invoice-orange">Réf. :</span> <b>${esc(x.ref)}</b></p><p><span class="invoice-orange">Date :</span> <b>${dateFr(x.date)}</b></p></div></div><div><div class="invoice-label">DESTINATAIRE</div><div class="invoice-small" style="margin-top:8mm"><p><span class="invoice-orange">Client :</span> <b>${esc(x.client)}</b></p><p><span class="invoice-orange">Adresse :</span> <b>${esc(x.address)}</b></p><p><span class="invoice-orange">E-mail :</span> <b>${esc(x.email)}</b></p></div></div></div><p style="margin:12mm 0 8mm;font-size:12px"><span class="invoice-orange"><b>Objet :</b></span> <b>${esc(x.object)}</b></p><table class="invoice-table"><thead><tr><th style="width:8%">N°</th><th>Désignation</th><th style="width:13%">Quantité</th><th style="width:17%">Prix<br>Unitaire</th><th style="width:17%">Montant</th></tr></thead><tbody>${x.items.map((i,n)=>`<tr><td>${n+1}</td><td style="text-align:left">${esc(i.designation)}</td><td>${i.qty}</td><td>${money(i.unit)}</td><td>${money((i.qty||0)*(i.unit||0))}</td></tr>`).join('')}<tr><td></td><td></td><td>-</td><td>-</td><td>-</td></tr><tr><td colspan="4" style="text-align:right;font-weight:bold">Total HT</td><td style="font-weight:bold">${money(total(x))}</td></tr></tbody></table><div style="display:grid;grid-template-columns:1.1fr .9fr;gap:10mm;margin-top:7mm"><div class="invoice-small"><p><b>Net à payer : ${money(total(x))} FCFA</b></p><p style="margin-top:7mm"><b>Modalités :</b></p><ul style="margin:4mm 0 0 5mm;padding:0"><li style="margin-bottom:3mm">• <b>Paiement :</b> ${esc(x.payment)}</li><li>• <b>Délai d’exécution :</b> ${esc(x.delay)}</li></ul></div><div class="invoice-sign-area"><div class="sign-text" style="margin-bottom:4mm"><strong>${titleText}</strong></div>${s.signature?`<img class="invoice-signature" src="${s.signature}"${dk('signature')} style="left:${Number(s.signatureX)||50}%;top:${Number(s.signatureY)||42}%;width:${Number(s.signatureSize)||34}mm">`:''}${s.stamp?`<img class="invoice-stamp" src="${s.stamp}"${dk('stamp')} style="left:${Number(s.stampX)||50}%;top:${Number(s.stampY)||58}%;width:${Number(s.stampSize)||30}mm">`:''}<div class="sign-text" style="margin-top:4mm"><strong>${esc(s.manager)}</strong></div></div></div></div>${invoiceFooter()}</div>`}
function list(history){let arr=state.invoices.slice();const q=filters.q.toLowerCase();if(q)arr=arr.filter(x=>[x.client,x.ref,x.object,...x.items.map(i=>i.designation)].join(' ').toLowerCase().includes(q));if(filters.from)arr=arr.filter(x=>x.date>=filters.from);if(filters.to)arr=arr.filter(x=>x.date<=filters.to);arr.sort((a,b)=>filters.sort==='client'?(a.client||'').localeCompare(b.client||''):filters.sort==='amount'?total(b)-total(a):filters.sort==='date-asc'?(a.date||'').localeCompare(b.date||''):(b.date||'').localeCompare(a.date||''));return `<div class="page-actions"><div><div class="eyebrow">${history?'Journal':'Bibliothèque'}</div><h2 class="section-title">${history?'Historique':'Mes factures'}</h2><p class="muted">Recherchez par client, période, objet ou désignation.</p></div><button class="primary" data-nav="create">${ico('plus',17)} Créer une facture</button></div><div class="panel filters"><label class="field search-field"><span>Recherche</span><input data-filter="q" class="input" value="${esc(filters.q)}" placeholder="Client, référence, objet..."></label><label class="field"><span>Du</span><input data-filter="from" type="date" class="input" value="${filters.from}"></label><label class="field"><span>Au</span><input data-filter="to" type="date" class="input" value="${filters.to}"></label><label class="field"><span>Trier par</span><select data-filter="sort" class="input"><option value="date-desc" ${filters.sort==='date-desc'?'selected':''}>Plus récentes</option><option value="date-asc" ${filters.sort==='date-asc'?'selected':''}>Plus anciennes</option><option value="client" ${filters.sort==='client'?'selected':''}>Nom client</option><option value="amount" ${filters.sort==='amount'?'selected':''}>Montant</option></select></label></div><div class="panel" style="padding:0;overflow:hidden"><div class="list-head"><div>Client</div><div>Référence</div><div>Objet</div><div>Statut</div><div>Date / Total</div><div>Actions</div></div>${arr.length?arr.map(row).join(''):'<div style="padding:50px;text-align:center;color:#94a0b4">Aucune facture trouvée</div>'}</div>`}
function row(x){const st=x.status||'pending';const isHistory=page==='history';return `<div class="list-row" data-preview="${x.id}"><div class="client-cell"><div class="rounded-xl bg-blue-50 text-blue-800 p-2">${ico('file-text',16)}</div><div><div class="client-name">${esc(x.client||'Client')}</div><div class="client-mail">${esc(x.email)}</div></div></div><div class="truncate">${esc(x.ref)}</div><div class="truncate">${esc(x.object)}</div><div><span class="status ${st}">${st==='validated'?'Validée':st==='negotiated'?'Négociée':'En attente'}</span></div><div><div style="font-size:12px">${dateFr(x.date)}</div><strong style="font-size:12px">${money(total(x))} FCFA</strong></div><div class="list-actions"><button class="icon-btn" title="Aperçu" data-preview="${x.id}">${ico('eye',16)}</button><button class="icon-btn" title="Modifier" data-edit="${x.id}">${ico('pencil',16)}</button><button class="icon-btn" title="PDF" data-pdf="${x.id}">${ico('download',16)}</button>${isHistory?`<button class="icon-btn" title="Exporter PDF" data-pdf="${x.id}">${ico('file-down',16)}</button>`:''}<button class="icon-btn" title="Supprimer" data-delete="${x.id}">${ico('trash-2',16)}</button>${x.type==='proforma'?`<button class="icon-btn" title="Négociée" data-status="negotiated" data-id="${x.id}">${ico('messages-square',16)}</button><button class="icon-btn" title="Valider et convertir" data-convert="${x.id}">${ico('badge-check',16)}</button>`:`<button class="icon-btn" title="Valider" data-status="validated" data-id="${x.id}">${ico('check-check',16)}</button>`}</div></div>`}

/* ---------- Settings ---------- */
function mediaCard(key,label,icon){const s=state.settings;const value=key==='logo'?(s.logo||''):(s[key]||'');const isCustom=!!value;const r=mediaRanges[key]||{size:[15,70],x:[0,90],y:[0,85]};const thumb=key==='logo'?(s.logo||ASSETS.logo):value;return `<div class="media-card"><div class="media-card-head"><div><strong style="font-size:13px">${ico(icon,17)} ${label}</strong><p class="muted">Glissez l’image sur l’aperçu ci-dessous.</p></div><div class="media-card-actions">${isCustom?`<button type="button" class="icon-btn" data-clear-image="${key}" title="Supprimer l’image">${ico('trash-2',16)}</button>`:''}<button type="button" class="icon-btn" data-reset-media="${key}" title="Réinitialiser la position">${ico('rotate-ccw',16)}</button></div></div><label class="upload-zone">${thumb?`<img class="media-thumb" src="${thumb}">`:`<div style="font-size:24px">${ico('upload-cloud',24)}</div><div style="font-weight:800;margin-top:7px">Importer une image</div>`}<input data-image="${key}" type="file" accept="image/*"></label><div class="media-controls"><label>Taille <input type="range" min="${r.size[0]}" max="${r.size[1]}" value="${s[key+'Size']||r.size[0]}" data-media-range="${key}Size"></label><label>Position X <input type="range" min="${r.x[0]}" max="${r.x[1]}" value="${s[key+'X']||0}" data-media-range="${key}X"></label><label>Position Y <input type="range" min="${r.y[0]}" max="${r.y[1]}" value="${s[key+'Y']||0}" data-media-range="${key}Y"></label></div></div>`}
function settings(){const s=state.settings;return `<div style="max-width:1040px;width:100%"><div class="panel form-panel"><div class="panel-head"><div><h2 class="panel-title">Informations de l’entreprise</h2><p class="muted">Identité affichée sur vos factures.</p></div></div><form id="settings-form" class="form-grid">${input('Nom de l’entreprise','companyName',s.companyName)}${input('Titre du gérant (ex: Gérant, Directeur)','title',s.title)}${input('Nom du gérant','manager',s.manager)}${input('Téléphones','phone',s.phone)}${input('Adresse','address',s.address)}${input('E-mail','email',s.email)}${input('Site web','website',s.website)}<div class="full"><button class="primary">${ico('save',17)} Enregistrer</button></div></form></div><div class="panel form-panel" style="margin-top:18px"><div class="panel-head"><div><h2 class="panel-title">Éléments visuels</h2><p class="muted">Importez votre logo, votre signature et votre cachet, puis positionnez-les directement sur l’aperçu ci-dessous. Le déplacement est instantané.</p></div></div><div class="media-cards">${mediaCard('logo','Logo','image')}${mediaCard('signature','Signature','pen-line')}${mediaCard('stamp','Cachet','stamp')}</div><div class="live-preview-label">${ico('move',14)} Aperçu en direct — glissez le logo, la signature ou le cachet à l’endroit voulu</div><div class="live-preview-wrap"><div class="live-stage" id="live-stage">${invoiceMarkup(previewSample(),true)}</div></div></div><div class="panel form-panel" style="margin-top:18px"><div class="panel-head"><div><h2 class="panel-title">Marges du document</h2><p class="muted">Ajustez la hauteur des marges supérieure et inférieure.</p></div></div><div class="invoice-margin-control"><label>Marge haute <input type="range" min="5" max="20" value="${s.marginTop||8}" data-margin="marginTop" style="width:120px"> <span id="marginTopVal">${s.marginTop||8}mm</span></label><label>Marge basse <input type="range" min="5" max="20" value="${s.marginBottom||8}" data-margin="marginBottom" style="width:120px"> <span id="marginBottomVal">${s.marginBottom||8}mm</span></label></div></div><div class="panel form-panel" style="margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap"><div><h2 class="panel-title">Données locales</h2><p class="muted">Sauvegardez ou réinitialisez vos données.</p></div><div style="display:flex;gap:8px"><button class="input" style="width:auto" data-backup>${ico('download',16)} Exporter JSON</button><button class="input" style="width:auto;color:#c33" data-reset>${ico('trash-2',16)} Réinitialiser</button></div></div></div>`}
function previewSample(){return state.invoices[0]||{type:'invoice',ref:'FACT WEDE-000000/1',date:new Date().toISOString().slice(0,10),client:'Client Exemple',address:'Adresse du client',email:'client@example.com',object:'Objet de la prestation',payment:'Paiement comptant',delay:'Délai à préciser',items:[{designation:'Prestation exemple',qty:1,unit:100000}]}}
function updateMargin(e){const key=e.currentTarget.dataset.margin;const val=Number(e.currentTarget.value);state.settings[key]=val;persist();const span=document.getElementById(key+'Val');if(span)span.textContent=val+'mm';const stage=document.getElementById('live-stage');if(stage){const paper=stage.querySelector('.invoice-paper');if(paper){const prop=key==='marginTop'?'paddingTop':'paddingBottom';paper.style[prop]=val+'mm';}}}
function editInvoice(id){editingId=id;page='create';persist();render()}
function removeInvoice(id){confirmBox('Supprimer cette facture ?').then(r=>{if(r.isConfirmed){state.invoices=state.invoices.filter(x=>x.id!==id);persist();notify('Facture supprimée');render()}})}
function setStatus(status,id){const x=state.invoices.find(i=>i.id===id);if(x){x.status=status;persist();notify(status==='validated'?'Facture validée':'Facture marquée négociée');render()}}
function convertProforma(id){const x=state.invoices.find(i=>i.id===id);if(x&&x.type==='proforma'){x.type='invoice';x.status='validated';x.convertedAt=new Date().toISOString();persist();notify('Pro forma validée : facture générée avec la même référence');render()}}

/* ---------- Preview modal ---------- */
function buildPreviewModal(x){const modal=document.createElement('div');modal.className='modal-backdrop';modal.innerHTML=`<div class="modal a4-preview-modal"><div class="a4-toolbar"><div><strong class="panel-title">Aperçu de la facture</strong><p class="muted">${esc(x.ref||'')} · ${esc(x.client||'')}</p></div><div style="display:flex;gap:8px"><button class="primary" data-a4-export>${ico('download',17)} Exporter PDF</button><button class="icon-btn modal-close">${ico('x',20)}</button></div></div><div class="a4-scroll"><div class="a4-fit-outer"><div class="a4-preview-paper">${invoiceMarkup(x)}</div></div></div></div>`;document.body.appendChild(modal);modal.querySelector('.modal-close').addEventListener('click',()=>modal.remove());modal.querySelector('[data-a4-export]').addEventListener('click',()=>exportPdfData(x));modal.addEventListener('click',e=>{if(e.target===modal)modal.remove()});if(Icons.createIcons)Icons.createIcons({root:modal});requestAnimationFrame(()=>fitPreviewPaper(modal.querySelector('.a4-preview-paper')));return modal}
function showPreview(id){const x=state.invoices.find(i=>i.id===id);if(!x)return;buildPreviewModal(x)}
function currentPreview(){const form=document.querySelector('#invoice-form');if(!form)return;const f=new FormData(form);const x={...Object.fromEntries(f.entries()),items:[...document.querySelectorAll('.line-item')].map(r=>({designation:r.querySelector('[name=designation]').value,qty:Number(r.querySelector('[name=qty]').value),unit:Number(r.querySelector('[name=unit]').value)}))};buildPreviewModal(x)}
function fitPreviewPaper(paper){if(!paper)return;const outer=paper.parentElement;const scroll=outer?.parentElement;if(!outer||!scroll)return;const naturalWidth=paper.scrollWidth||210*3.78;const availWidth=Math.max(240,scroll.clientWidth-44);const scale=Math.min(1,availWidth/naturalWidth);paper.style.transformOrigin='top left';paper.style.transform='scale('+scale+')';outer.style.width=(naturalWidth*scale)+'px';outer.style.height=(paper.scrollHeight*scale)+'px';}
function fitLiveStage(){const outer=document.getElementById('live-stage');if(!outer)return;const paper=outer.querySelector('.invoice-paper');if(!paper)return;const wrap=outer.parentElement;const naturalWidth=paper.scrollWidth||210*3.78;const availWidth=Math.max(260,wrap.clientWidth-28);const scale=Math.min(1,availWidth/naturalWidth);paper.style.transformOrigin='top left';paper.style.transform='scale('+scale+')';outer.style.width=(naturalWidth*scale)+'px';outer.style.height=(paper.scrollHeight*scale)+'px';}
window.addEventListener('resize',()=>{document.querySelectorAll('.a4-preview-paper').forEach(fitPreviewPaper);if(page==='settings')fitLiveStage()});

/* ---------- Drag positioning ---------- */
function bindDragging(){const stage=document.getElementById('live-stage');if(!stage)return;stage.querySelectorAll('[data-drag-key]').forEach(el=>{el.onpointerdown=function(e){e.preventDefault();const key=el.dataset.dragKey;try{el.setPointerCapture(e.pointerId)}catch(err){}el.classList.add('dragging');function move(ev){const parent=el.offsetParent;if(!parent)return;const rect=parent.getBoundingClientRect();let px=((ev.clientX-rect.left)/rect.width)*100;let py=((ev.clientY-rect.top)/rect.height)*100;px=Math.max(0,Math.min(92,px));py=Math.max(0,Math.min(88,py));el.style.left=px.toFixed(1)+'%';el.style.top=py.toFixed(1)+'%';state.settings[key+'X']=Math.round(px);state.settings[key+'Y']=Math.round(py)}function up(ev){move(ev);el.onpointermove=null;el.onpointerup=null;el.classList.remove('dragging');persist();render()}el.onpointermove=move;el.onpointerup=up}})}
function updateMediaSetting(e){const key=e.currentTarget.dataset.mediaRange;const val=Number(e.currentTarget.value);state.settings[key]=val;const stage=document.getElementById('live-stage');if(stage){const dragKey=key.replace(/(X|Y|Size)$/,'');const el=stage.querySelector('[data-drag-key="'+dragKey+'"]');if(el){if(key.endsWith('Size'))el.style.width=val+'mm';else if(key.endsWith('X'))el.style.left=val+'%';else if(key.endsWith('Y'))el.style.top=val+'%';}}persist()}
function clearImage(e){const key=e.currentTarget.dataset.clearImage;confirmBox('Supprimer cette image ?').then(r=>{if(r.isConfirmed){if(key==='logo')state.settings.logo='';else state.settings[key]='';persist();notify('Image supprimée');render()}})}
function resetMedia(e){const key=e.currentTarget.dataset.resetMedia;const defaults={logo:{X:0,Y:0,Size:42},signature:{X:50,Y:42,Size:34},stamp:{X:50,Y:58,Size:30}};const d=defaults[key]||{X:0,Y:0,Size:30};state.settings[key+'X']=d.X;state.settings[key+'Y']=d.Y;state.settings[key+'Size']=d.Size;persist();notify('Position réinitialisée');render()}
function readImage(e){const file=e.target.files?.[0],key=e.currentTarget.dataset.image;if(!file)return;const r=new FileReader();r.onload=()=>{state.settings[key]=r.result;persist();notify('Image enregistrée');render()};r.readAsDataURL(file)}
function saveSettings(e){e.preventDefault();const f=new FormData(e.currentTarget);state.settings={...state.settings,companyName:f.get('companyName'),title:f.get('title'),manager:f.get('manager'),phone:f.get('phone'),address:f.get('address'),email:f.get('email'),website:f.get('website')};persist();notify('Paramètres enregistrés');render()}
function downloadBackup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='le-facturier-sauvegarde.json';a.click();notify('Sauvegarde téléchargée')}
function resetData(){confirmBox('Réinitialiser les données ?').then(r=>{if(r.isConfirmed){localStorage.removeItem(STORE);state=readStore();page='dashboard';persist();notify('Données réinitialisées');render()}})}

/* ---------- PDF export ---------- */
function pdfFilename(x){return `${(x.ref||'facture').replace(/[^a-z0-9]/gi,'_')}_${(x.client||'client').replace(/[^a-z0-9]/gi,'_')}.pdf`}
function waitForImages(el){const imgs=[...el.querySelectorAll('img')];return Promise.all(imgs.map(img=>{if(img.complete&&img.naturalWidth>0)return Promise.resolve();return new Promise(res=>{img.onload=res;img.onerror=res;setTimeout(res,3000)})}))}
function makePdf(x){const holder=document.createElement('div');holder.style.position='fixed';holder.style.left='0';holder.style.top='0';holder.style.opacity='0';holder.style.pointerEvents='none';holder.style.zIndex='-1';holder.style.width='210mm';holder.innerHTML=invoiceMarkup(x);document.body.appendChild(holder);if(Icons.createIcons)Icons.createIcons({root:holder});if(!window.html2pdf){notify('Bibliothèque PDF indisponible : impression du navigateur utilisée','warning');window.print();holder.remove();return Promise.resolve(null)}const paperEl=holder.firstElementChild;const opts={margin:0,filename:pdfFilename(x),image:{type:'jpeg',quality:.98},html2canvas:{scale:2,useCORS:true,allowTaint:true,backgroundColor:'#fff',width:paperEl.scrollWidth,height:paperEl.scrollHeight},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}};return waitForImages(holder).then(()=>new Promise(res=>requestAnimationFrame(()=>requestAnimationFrame(res)))).then(()=>html2pdf().set(opts).from(paperEl).outputPdf('blob')).then(blob=>{holder.remove();return blob}).catch(err=>{holder.remove();console.error('PDF export error',err);throw err})}
function exportPdfData(x){makePdf(x).then(blob=>{if(!blob)return;const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=pdfFilename(x);a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);notify('PDF téléchargé')}).catch(()=>notify('Impossible de générer le PDF','error'))}
function exportPdf(id){const x=state.invoices.find(i=>i.id===id);if(x)exportPdfData(x)}
function sharePdf(id){const x=state.invoices.find(i=>i.id===id);if(!x)return;makePdf(x).then(blob=>{if(!blob)return;const file=new File([blob],pdfFilename(x),{type:'application/pdf'});if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]})))return navigator.share({title:x.ref,text:`Facture ${x.ref} — ${x.client}`,files:[file]}).then(()=>notify('PDF partagé'));const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=pdfFilename(x);a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);notify('PDF téléchargé')}).catch(()=>notify('Partage indisponible','error'))}
function offerPdf(id){const x=state.invoices.find(i=>i.id===id);if(!x)return;if(window.Swal&&typeof Swal.fire==='function'){Swal.fire({title:'Facture enregistrée',text:'Souhaitez-vous exporter ou partager le PDF maintenant ?',icon:'success',showDenyButton:true,showCancelButton:true,confirmButtonText:'Exporter le PDF',denyButtonText:'Partager le PDF',cancelButtonText:'Plus tard',confirmButtonColor:'#123b85',denyButtonColor:'#168fd0'}).then(r=>{if(r.isConfirmed)exportPdf(id);else if(r.isDenied)sharePdf(id)})}else if(window.confirm('Exporter le PDF maintenant ?'))exportPdf(id)}

/* ---------- Type select auto-ref ---------- */
document.addEventListener('change',e=>{if(e.target.matches('[data-type-select]')){const form=e.target.closest('#invoice-form');if(!form)return;const refInput=form.querySelector('[name=ref]');if(!refInput)return;const type=e.target.value;const prefix=type==='proforma'?'FACT PRO WEDE-':'FACT WEDE-';const ym=new Date().toISOString().slice(0,7).replace('-','');const nums=state.invoices.filter(x=>(x.type||'invoice')===type).map(x=>Number(String(x.ref||'').split('/').pop())).filter(Boolean);const n=Math.max(0,...nums)+1;refInput.value=prefix+ym+'/'+n;}});

document.addEventListener('input',e=>{if(e.target.closest('#invoice-form')&&(e.target.name==='qty'||e.target.name==='unit'))updateEditorTotal()});
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
window.deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.deferredPrompt=e;});
})();
</script>
</body>
