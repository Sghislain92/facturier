<body><div id="app"></div>
<script>
(function(){
'use strict';
const ASSETS={logo:'/manus-storage/logo_57078cae.png'};
const STORE='le-facturier-v2';
const fallbackIcons={createIcons:function(){document.querySelectorAll('[data-lucide]').forEach(function(e){if(!e.innerHTML)e.innerHTML='•'})}};
const Icons=window.lucide||fallbackIcons;
const makeId=()=>window.crypto&&crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);
const baseSettings={companyName:'Websoft Enterprise Digital Engineering SARL',manager:'Yaovi Ghislain SIATE',logoSize:42,logoX:0,logoY:0,signatureX:0,signatureY:0,signatureSize:34,stampX:55,stampY:0,stampSize:30,phone:'+229 01 97 83 23 90 / +229 01 95 36 65 65',email:'contact@websoftenterprise.com',website:'www.websoftenterprise.com',address:'Dowa, Porto-Novo, Bénin',signature:'',stamp:''};
const seed={id:makeId(),type:'proforma',status:'pending',ref:'FACT PRO WEDE-202609/123',date:'2026-09-01',client:'Res’AU',address:'Lomé, Togo',email:'infos.resau@gmail.com',object:'Renouvellement de l’hébergement web',payment:'Paiement comptant',delay:'6h après réception du paiement',items:[{designation:'Renouvellement de l’hébergement web (12 mois)',qty:1,unit:100000},{designation:'Configuration et frais agence',qty:1,unit:25000}],createdAt:new Date().toISOString()};
function readStore(){try{const raw=localStorage.getItem(STORE);if(raw)return JSON.parse(raw)}catch(e){}const initial={invoices:[seed],settings:{...baseSettings},page:'dashboard'};localStorage.setItem(STORE,JSON.stringify(initial));return initial}
let state=readStore();state.settings={...baseSettings,...(state.settings||{})};let page=state.page||'dashboard', editingId=null, filters={q:'',from:'',to:'',sort:'date-desc'};
function persist(){state.page=page;localStorage.setItem(STORE,JSON.stringify(state));window.dispatchEvent(new CustomEvent('facturier:updated'))}
window.addEventListener('storage',function(e){if(e.key===STORE){state=readStore();page=state.page||'dashboard';render()}});
window.addEventListener('facturier:updated',function(){if(!document.querySelector(':focus'))render()});
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=n=>new Intl.NumberFormat('fr-FR').format(Number(n)||0);
const dateFr=d=>d?new Date(d+'T00:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'}):'';
const total=x=>(x.items||[]).reduce((a,i)=>a+(Number(i.qty)||0)*(Number(i.unit)||0),0);
const ico=(n,s=18)=>`<i data-lucide="${n}" width="${s}" height="${s}"></i>`;
function notify(title,type='success'){if(window.Swal&&typeof Swal.fire==='function'){Swal.fire({toast:true,position:'top-end',showConfirmButton:false,timer:2200,icon:type,title})}else{const n=document.createElement('div');n.className='fixed top-4 right-4 z-[100] bg-slate-900 text-white px-4 py-3 rounded-xl text-sm font-bold';n.textContent=title;document.body.appendChild(n);setTimeout(()=>n.remove(),2200)}}
function confirmBox(title){if(window.Swal&&typeof Swal.fire==='function')return Swal.fire({title,text:'Cette action est irréversible.',icon:'warning',showCancelButton:true,confirmButtonColor:'#123b85',confirmButtonText:'Confirmer',cancelButtonText:'Annuler'});return Promise.resolve({isConfirmed:window.confirm(title)})}
function refNext(type){const prefix=type==='proforma'?'FACT PRO WEDE-':'FACT WEDE-';const ym=new Date().toISOString().slice(0,7).replace('-','');const nums=state.invoices.filter(x=>(x.type||'invoice')===type).map(x=>Number(String(x.ref||'').split('/').pop())).filter(Boolean);const n=Math.max(type==='invoice'?123:0,...nums)+1;return prefix+ym+'/'+n}
function navButton(id,label,icon){return `<button class="nav-btn ${page===id?'active':''}" data-nav="${id}">${ico(icon,18)}<span>${label}</span></button>`}
function mobileNav(id,label,icon){return `<button class="mobile-nav ${page===id?'active':''}" data-nav="${id}">${ico(icon,20)}<span>${label}</span></button>`}
function layout(content){return `<div class="app-shell"><aside class="sidebar"><div class="brand"><img src="${ASSETS.logo}"><div><div class="brand-name">Le Facturier</div><div class="brand-sub">Websoft Enterprise</div></div></div><nav class="side-nav">${navButton('dashboard','Accueil','layout-dashboard')}${navButton('create','Créer facture','file-plus-2')}${navButton('invoices','Mes factures','files')}${navButton('history','Historique','history')}${navButton('settings','Paramètres','settings')}</nav><div class="local-box"><small>Stockage local</small><strong>Vos données restent ici</strong><small style="margin-top:8px">Aucune base externe utilisée.</small></div></aside><section class="workspace"><header class="topbar"><div><div class="eyebrow">Espace de gestion</div><h1 class="page-heading">${title()}</h1></div><div style="display:flex;align-items:center;gap:10px"><button class="mobile-menu-btn" data-action="drawer-open">${ico('menu',21)}</button></div></header><main class="main">${content}</main></section><div class="drawer" id="drawer"><div class="drawer-shade" data-action="drawer-close"></div><aside class="drawer-panel"><div style="display:flex;justify-content:space-between;align-items:center"><div class="brand" style="margin:0"><img src="${ASSETS.logo}"><div><div class="brand-name">Le Facturier</div><div class="brand-sub">Menu</div></div></div><button class="icon-btn" data-action="drawer-close">${ico('x',20)}</button></div><nav class="side-nav">${navButton('dashboard','Accueil','layout-dashboard')}${navButton('create','Créer facture','file-plus-2')}${navButton('invoices','Mes factures','files')}${navButton('history','Historique','history')}${navButton('settings','Paramètres','settings')}</nav></aside></div><nav class="mobile-bottom">${mobileNav('dashboard','Accueil','house')}${mobileNav('create','Créer','plus-square')}${mobileNav('history','Historique','history')}${mobileNav('settings','Paramètres','settings')}</nav></div>`}
function title(){return {dashboard:'Vue d’ensemble',create:editingId?'Modifier la facture':'Nouvelle facture',invoices:'Mes factures',history:'Historique des créations',settings:'Paramètres'}[page]}
function render(){document.getElementById('app').innerHTML=layout(page==='dashboard'?dashboard():page==='create'?editor():page==='settings'?settings():list(page==='history'));if(Icons.createIcons)Icons.createIcons();bindEvents()}
function bindEvents(){document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.nav)));document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',handleAction));document.querySelectorAll('[data-filter]').forEach(e=>e.addEventListener(e.tagName==='SELECT'||e.type==='date'?'change':'input',()=>{filters[e.dataset.filter]=e.value;render()}));const form=document.querySelector('#invoice-form');if(form)form.addEventListener('submit',saveInvoice);document.querySelectorAll('[data-line-action]').forEach(b=>b.addEventListener('click',lineAction));document.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>editInvoice(b.dataset.edit)));document.querySelectorAll('[data-preview]').forEach(b=>b.addEventListener('click',()=>showPreview(b.dataset.preview)));document.querySelectorAll('[data-pdf]').forEach(b=>b.addEventListener('click',()=>exportPdf(b.dataset.pdf)));document.querySelectorAll('[data-delete]').forEach(b=>b.addEventListener('click',()=>removeInvoice(b.dataset.delete)));document.querySelectorAll('[data-status]').forEach(b=>b.addEventListener('click',()=>setStatus(b.dataset.status,b.dataset.id)));document.querySelectorAll('[data-convert]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();confirmConversion(b.dataset.convert)}));document.querySelectorAll('[data-image]').forEach(e=>e.addEventListener('change',readImage));document.querySelectorAll('[data-media-range]').forEach(e=>e.addEventListener('input',updateMediaSetting));document.querySelectorAll('[data-clear-image]').forEach(e=>e.addEventListener('click',clearImage));document.querySelectorAll('[data-reset-media]').forEach(e=>e.addEventListener('click',resetMedia));bindDragging();const settingsForm=document.querySelector('#settings-form');if(settingsForm)settingsForm.addEventListener('submit',saveSettings);const backup=document.querySelector('[data-backup]');if(backup)backup.addEventListener('click',downloadBackup);const reset=document.querySelector('[data-reset]');if(reset)reset.addEventListener('click',resetData);}
function navigate(p){page=p;editingId=null;persist();render();window.scrollTo({top:0,behavior:'smooth'});closeDrawer()}
function handleAction(e){const a=e.currentTarget.dataset.action;if(a==='drawer-open')document.getElementById('drawer').classList.add('open');if(a==='drawer-close')closeDrawer();if(a==='preview-current')currentPreview()}
function closeDrawer(){document.getElementById('drawer')?.classList.remove('open')}
function stat(label,value,sub,icon,color){return `<div class="stat-card"><div style="display:flex;justify-content:space-between;gap:8px"><div style="min-width:0"><div class="stat-label">${label}</div><div class="stat-value">${value}</div><div class="stat-sub">${sub}</div></div><div class="rounded-xl p-2.5 ${color}">${ico(icon,19)}</div></div></div>`}
function dashboard(){const totalAll=state.invoices.reduce((a,x)=>a+total(x),0),clients=new Set(state.invoices.map(x=>(x.client||'').toLowerCase())).size,month=state.invoices.filter(x=>x.date?.slice(0,7)===new Date().toISOString().slice(0,7)).length;return `<section class="hero"><div class="hero-dot"></div><div class="hero-copy"><div class="eyebrow" style="color:#bcd6ff">Votre atelier de facturation</div><h2>Facturez avec la signature Websoft.</h2><p>Un espace simple, rapide et entièrement local pour piloter vos documents Websoft Enterprise.</p><button class="primary" data-nav="create">${ico('file-plus-2',18)} Commencer une facture</button></div></section><section class="stats-grid">${stat('Factures créées',state.invoices.length,'dans votre espace','files','bg-blue-50 text-blue-800')}${stat('Chiffre d’affaires',money(totalAll)+' FCFA','total HT cumulé','banknote','bg-orange-50 text-orange-600')}${stat('Clients uniques',clients,'depuis le début','users','bg-cyan-50 text-cyan-700')}${stat('Ce mois-ci',month,'factures datées du mois','calendar-days','bg-emerald-50 text-emerald-700')}</section><section class="bottom-grid"><div class="panel"><div class="panel-head"><div><h2 class="panel-title">Dernières factures</h2><p class="muted">Vos documents les plus récents</p></div><button class="text-blue-800 text-sm font-bold" data-nav="invoices">Tout voir →</button></div>${state.invoices.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,5).map(recent).join('')||'<p class="muted">Aucune facture</p>'}</div><div class="panel"><h2 class="panel-title">Raccourcis</h2><div class="shortcut-grid" style="margin-top:18px"><button class="shortcut" data-nav="create">${ico('plus',22)}<br><span>Nouvelle facture</span></button><button class="shortcut orange" data-nav="settings">${ico('stamp',22)}<br><span>Mon cachet</span></button></div></div></section>`}
function recent(x){return `<div class="recent-row" data-preview="${x.id}"><div class="recent-main"><div class="rounded-xl bg-blue-50 text-blue-800 p-2">${ico('file-text',17)}</div><div><div class="recent-name">${esc(x.client||'Client')}</div><div class="recent-meta">${esc(x.ref)} · ${dateFr(x.date)}</div></div></div><strong>${money(total(x))}<small style="display:block;color:#94a0b4;text-align:right;font-size:10px">FCFA</small></strong></div>`}
function input(label,name,value,type='text',extra=''){return `<label class="field"><span>${label}</span><input class="input" name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`}
function editor(){const x=editingId?state.invoices.find(i=>i.id===editingId):{type:'invoice',status:'pending',ref:refNext('invoice'),date:new Date().toISOString().slice(0,10),client:'',address:'',email:'',object:'',payment:'Paiement comptant',delay:'6h après réception du paiement',items:[{designation:'',qty:1,unit:0}]};return `<form id="invoice-form" class="editor-grid"><div style="min-width:0"><section class="panel form-panel"><div class="panel-head"><div><h2 class="panel-title">Informations de la facture</h2><p class="muted">Toutes les données sont conservées dans localStorage.</p></div><span class="status negotiated">Étape 01</span></div><div class="form-grid"><label class="field"><span>Type de document</span><select class="input" name="type" data-type-select><option value="invoice" ${x.type!=='proforma'?'selected':''}>Facture</option><option value="proforma" ${x.type==='proforma'?'selected':''}>Facture pro forma</option></select></label>${input('Référence','ref',x.ref)}${input('Date d’émission','date',x.date,'date')}${input('Nom du client','client',x.client)}${input('Adresse','address',x.address)}${input('E-mail','email',x.email,'email')}<div class="full">${input('Objet de la prestation','object',x.object)}</div></div></section><section class="panel form-panel" style="margin-top:18px"><div class="panel-head"><div><h2 class="panel-title">Désignations</h2><p class="muted">Ajoutez autant de lignes que nécessaire.</p></div><button type="button" class="primary" data-line-action="add">${ico('plus',16)} Ajouter une ligne</button></div><div class="line-list" id="line-list">${x.items.map(line).join('')}</div><div style="display:flex;justify-content:flex-end;margin-top:18px"><div style="text-align:right"><div class="muted">Total HT</div><strong id="editor-total" style="font-size:25px;color:var(--brand)">${money(total(x))} FCFA</strong></div></div></section><section class="panel form-panel" style="margin-top:18px"><div class="form-grid">${input('Modalités de paiement','payment',x.payment)}${input('Délai d’exécution','delay',x.delay)}</div></section><div style="display:flex;gap:10px;margin-top:18px"><button type="button" class="input" style="width:auto;padding:0 18px;font-weight:800" data-nav="invoices">Annuler</button><button type="submit" class="primary">${ico('save',17)} Enregistrer la facture</button></div></div><aside class="preview-sticky"><div class="panel-head"><strong>Aperçu rapide</strong><span class="muted">A4 · prêt à exporter</span></div><div class="mini-wrap"><div class="mini-scale">${invoiceMarkup(x)}</div></div><button type="button" class="input" style="margin-top:10px;font-weight:800" data-action="preview-current">${ico('eye',17)} Voir l’aperçu complet</button></aside></form>`}
function line(i){return `<div class="line-item"><label class="field"><span>Désignation</span><input class="input" name="designation" value="${esc(i.designation)}"></label><label class="field"><span>Qté</span><input class="input" name="qty" type="number" min="0" step="1" value="${i.qty}"></label><label class="field"><span>Prix unitaire</span><input class="input" name="unit" type="number" min="0" step="1" value="${i.unit}"></label><button type="button" class="icon-btn" data-line-action="remove">${ico('trash-2',17)}</button></div>`}
function lineAction(e){if(e.currentTarget.dataset.lineAction==='add'){document.getElementById('line-list').insertAdjacentHTML('beforeend',line({designation:'',qty:1,unit:0}));bindEvents();Icons.createIcons()}else{e.currentTarget.closest('.line-item').remove();updateEditorTotal()}}
function updateEditorTotal(){const t=[...document.querySelectorAll('.line-item')].reduce((a,r)=>a+(Number(r.querySelector('[name=qty]').value)||0)*(Number(r.querySelector('[name=unit]').value)||0),0);const out=document.getElementById('editor-total');if(out)out.textContent=money(t)+' FCFA'}
function saveInvoice(e){e.preventDefault();const f=new FormData(e.currentTarget),type=f.get('type')||'invoice';const items=[...document.querySelectorAll('.line-item')].map(r=>({designation:r.querySelector('[name=designation]').value,qty:Number(r.querySelector('[name=qty]').value)||0,unit:Number(r.querySelector('[name=unit]').value)||0})).filter(i=>i.designation||i.unit);if(!f.get('client')||!items.length){notify('Client et désignation requis','warning');return}const old=editingId?state.invoices.find(i=>i.id===editingId):null;const x={id:old?.id||makeId(),type,status:old?.status||'pending',ref:old?.ref||refNext(type),date:f.get('date'),client:f.get('client'),address:f.get('address'),email:f.get('email'),object:f.get('object'),payment:f.get('payment'),delay:f.get('delay'),items,createdAt:old?.createdAt||new Date().toISOString()};const idx=state.invoices.findIndex(i=>i.id===x.id);if(idx>=0)state.invoices[idx]=x;else state.invoices.unshift(x);persist();notify(idx>=0?'Facture mise à jour':'Facture enregistrée');page='invoices';editingId=null;persist();render();setTimeout(()=>offerPdf(x.id),120)}
function invoiceHeader(){const s=state.settings;return `<div class="invoice-brand-head"><div class="invoice-brand-left"><img src="${ASSETS.logo}" class="invoice-brand-logo" style="width:${Number(s.logoSize)||42}mm;left:${Number(s.logoX)||0}%;top:${Number(s.logoY)||0}%"></div><div class="invoice-brand-right">Développement de site web, d’applications web & mobiles, Solutions SaaS et Cloud, Intégration de solutions de paiement, Solutions de cybersécurité, Communication digitale, Formation & assistance IT</div></div>`}
function invoiceFooter(){return `<div class="invoice-brand-foot"><div class="invoice-foot-bars"><span></span><span></span><span></span></div><div class="invoice-foot-cols"><div>${ico('phone',16)}<span>+229 01 97 83 23 90<br>+229 01 95 36 65 65</span></div><div>${ico('globe',16)}<span>www.websoftenterprise.com<br>contact@websoftenterprise.com</span></div><div>${ico('house',16)}<span>Dowa<br>Porto-Novo, Bénin</span></div></div><div class="invoice-foot-legal"><span style="color:#3659a8">Websoft Enterprise Digital Engineering SARL</span> au Capital social de 3.300.000 FCFA &nbsp;|&nbsp; N° RCCM RB/ABC/25 B 9290<br>IFU: 3202521113042 &nbsp;|&nbsp; Compte Bancaire CORIS BANK INTERNATIONAL: BJ66 BJ21 2030 0500 5389 1241 0125<br>Porto-Novo – Bénin</div></div>`}
function confirmConversion(id){const x=state.invoices.find(i=>i.id===id);if(!x)return;const modal=document.createElement('div');modal.className='modal-backdrop';modal.innerHTML=`<div class="modal" style="max-width:520px"><button class="icon-btn modal-close" data-cancel>${ico('x',20)}</button><div style="width:52px;height:52px;border-radius:16px;background:#e8f7ef;color:#16834b;display:flex;align-items:center;justify-content:center;margin-bottom:15px">${ico('badge-check',27)}</div><h2 class="panel-title">Convertir en facture définitive ?</h2><p class="muted" style="line-height:1.6;margin-top:8px">Cette action valide la pro forma et crée la facture définitive en conservant exactement la même référence.</p><div style="margin:18px 0;padding:15px;border-radius:14px;background:#f6f9fd"><div style="font-size:11px;color:#8793a8;font-weight:800;text-transform:uppercase">Résumé</div><div style="display:flex;justify-content:space-between;margin-top:10px;font-size:13px"><strong>${esc(x.client)}</strong><strong>${money(total(x))} FCFA</strong></div><div style="font-size:12px;color:#68758b;margin-top:5px">${esc(x.ref)} · ${dateFr(x.date)}</div></div><div style="display:flex;justify-content:flex-end;gap:10px"><button class="input" style="width:auto;padding:0 18px;font-weight:800" data-cancel>Annuler</button><button class="primary" data-confirm>${ico('check-check',17)} Confirmer la conversion</button></div></div>`;document.body.appendChild(modal);modal.querySelectorAll('[data-cancel]').forEach(b=>b.addEventListener('click',()=>modal.remove()));modal.querySelector('[data-confirm]').addEventListener('click',()=>{modal.remove();convertProforma(id)});modal.addEventListener('click',e=>{if(e.target===modal)modal.remove()});if(Icons.createIcons)Icons.createIcons({root:modal})}
function invoiceMarkup(x){const s=state.settings;return `<div class="invoice-paper">${invoiceHeader()}<div class="invoice-meta"><div><div class="invoice-label">${x.type==='proforma'?'FACTURE PROFORMA':'FACTURE'}</div><div class="invoice-small" style="margin-top:8mm"><p><span class="invoice-orange">Réf. :</span> <b>${esc(x.ref)}</b></p><p><span class="invoice-orange">Date :</span> <b>${dateFr(x.date)}</b></p></div></div><div><div class="invoice-label">DESTINATAIRE</div><div class="invoice-small" style="margin-top:8mm"><p><span class="invoice-orange">Client :</span> <b>${esc(x.client)}</b></p><p><span class="invoice-orange">Adresse :</span> <b>${esc(x.address)}</b></p><p><span class="invoice-orange">E-mail :</span> <b>${esc(x.email)}</b></p></div></div></div><p style="margin:12mm 0 8mm;font-size:12px"><span class="invoice-orange"><b>Objet :</b></span> <b>${esc(x.object)}</b></p><table class="invoice-table"><thead><tr><th style="width:8%">N°</th><th>Désignation</th><th style="width:13%">Quantité</th><th style="width:17%">Prix<br>Unitaire</th><th style="width:17%">Montant</th></tr></thead><tbody>${x.items.map((i,n)=>`<tr><td>${n+1}</td><td style="text-align:left">${esc(i.designation)}</td><td>${i.qty}</td><td>${money(i.unit)}</td><td>${money((i.qty||0)*(i.unit||0))}</td></tr>`).join('')}<tr><td></td><td></td><td>-</td><td>-</td><td>-</td></tr><tr><td colspan="4" style="text-align:right;font-weight:bold">Total HT</td><td style="font-weight:bold">${money(total(x))}</td></tr></tbody></table><div style="display:grid;grid-template-columns:1.1fr .9fr;gap:10mm;margin-top:7mm"><div class="invoice-small"><p><b>Net à payer : ${money(total(x))} FCFA</b></p><p style="margin-top:7mm"><b>Modalités :</b></p><ul style="margin:4mm 0 0 5mm;padding:0"><li style="margin-bottom:3mm">• <b>Paiement :</b> ${esc(x.payment)}</li><li>• <b>Délai d’exécution :</b> ${esc(x.delay)}</li></ul></div><div class="invoice-sign-area"><div>Le Gérant de Websoft Enterprise</div>${s.signature?`<img class="invoice-signature" src="${s.signature}" style="left:${Number(s.signatureX)||0}%;top:${Number(s.signatureY)||12}%;width:${Number(s.signatureSize)||34}mm">`:''}${s.stamp?`<img class="invoice-stamp" src="${s.stamp}" style="left:${Number(s.stampX)||55}%;top:${Number(s.stampY)||12}%;width:${Number(s.stampSize)||30}mm">`:''}<div style="font-weight:bold;margin-top:12mm">${esc(s.manager)}</div></div></div>${invoiceFooter()}</div>`}
function list(history){let arr=state.invoices.slice();const q=filters.q.toLowerCase();if(q)arr=arr.filter(x=>[x.client,x.ref,x.object,...x.items.map(i=>i.designation)].join(' ').toLowerCase().includes(q));if(filters.from)arr=arr.filter(x=>x.date>=filters.from);if(filters.to)arr=arr.filter(x=>x.date<=filters.to);arr.sort((a,b)=>filters.sort==='client'?(a.client||'').localeCompare(b.client||''):filters.sort==='amount'?total(b)-total(a):filters.sort==='date-asc'?(a.date||'').localeCompare(b.date||''):(b.date||'').localeCompare(a.date||''));return `<div class="page-actions"><div><div class="eyebrow">${history?'Journal':'Bibliothèque'}</div><h2 class="section-title">${history?'Historique':'Mes factures'}</h2><p class="muted">Recherchez par client, période, objet ou désignation.</p></div><button class="primary" data-nav="create">${ico('plus',17)} Créer une facture</button></div><div class="panel filters"><label class="field search-field"><span>Recherche</span><input data-filter="q" class="input" value="${esc(filters.q)}" placeholder="Client, référence, objet..."></label><label class="field"><span>Du</span><input data-filter="from" type="date" class="input" value="${filters.from}"></label><label class="field"><span>Au</span><input data-filter="to" type="date" class="input" value="${filters.to}"></label><label class="field"><span>Trier par</span><select data-filter="sort" class="input"><option value="date-desc" ${filters.sort==='date-desc'?'selected':''}>Plus récentes</option><option value="date-asc" ${filters.sort==='date-asc'?'selected':''}>Plus anciennes</option><option value="client" ${filters.sort==='client'?'selected':''}>Nom client</option><option value="amount" ${filters.sort==='amount'?'selected':''}>Montant</option></select></label></div><div class="panel" style="padding:0;overflow:hidden"><div class="list-head"><div>Client</div><div>Référence</div><div>Objet</div><div>Statut</div><div>Date / Total</div><div>Actions</div></div>${arr.length?arr.map(row).join(''):'<div style="padding:50px;text-align:center;color:#94a0b4">Aucune facture trouvée</div>'}</div>`}
function row(x){const st=x.status||'pending';return `<div class="list-row" data-preview="${x.id}"><div class="client-cell"><div class="rounded-xl bg-blue-50 text-blue-800 p-2">${ico('file-text',16)}</div><div><div class="client-name">${esc(x.client||'Client')}</div><div class="client-mail">${esc(x.email)}</div></div></div><div class="truncate">${esc(x.ref)}</div><div class="truncate">${esc(x.object)}</div><div><span class="status ${st}">${st==='validated'?'Validée':st==='negotiated'?'Négociée':'En attente'}</span></div><div><div style="font-size:12px">${dateFr(x.date)}</div><strong style="font-size:12px">${money(total(x))} FCFA</strong></div><div class="list-actions"><button class="icon-btn" title="Aperçu" data-preview="${x.id}">${ico('eye',16)}</button><button class="icon-btn" title="Modifier" data-edit="${x.id}">${ico('pencil',16)}</button><button class="icon-btn" title="PDF" data-pdf="${x.id}">${ico('download',16)}</button><button class="icon-btn" title="Supprimer" data-delete="${x.id}">${ico('trash-2',16)}</button>${x.type==='proforma'?`<button class="icon-btn" title="Négociée" data-status="negotiated" data-id="${x.id}">${ico('messages-square',16)}</button><button class="icon-btn" title="Valider et convertir" data-convert="${x.id}">${ico('badge-check',16)}</button>`:`<button class="icon-btn" title="Valider" data-status="validated" data-id="${x.id}">${ico('check-check',16)}</button>`}</div></div>`}
function mediaCard(key,label,icon){const s=state.settings;const value=s[key]||'';return `<div class="media-card"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><div><strong style="font-size:13px">${ico(icon,17)} ${label}</strong><p class="muted">Glissez l’élément dans l’aperçu.</p></div>${value?`<button type="button" class="icon-btn" data-clear-image="${key}" title="Supprimer">${ico('trash-2',16)}</button>`:''}<button type="button" class="icon-btn" data-reset-media="${key}" title="Réinitialiser la position">${ico('rotate-ccw',16)}</button></div><label class="upload-zone">${value?`<img class="media-thumb" src="${value}">`:`<div style="font-size:24px">${ico('upload-cloud',24)}</div><div style="font-weight:800;margin-top:7px">Importer une image</div>`}<input data-image="${key}" type="file" accept="image/*"></label><div class="media-controls"><label>Taille <input type="range" min="12" max="70" value="${s[key+'Size']||30}" data-media-range="${key}Size"></label><label>X <input type="range" min="0" max="85" value="${s[key+'X']||0}" data-media-range="${key}X"></label><label>Y <input type="range" min="0" max="80" value="${s[key+'Y']||0}" data-media-range="${key}Y"></label></div></div>`}
function settings(){const s=state.settings;return `<div style="max-width:980px"><div class="panel form-panel"><div class="panel-head"><div><h2 class="panel-title">Paramètres</h2><p class="muted">Identité affichée sur vos factures.</p></div></div><form id="settings-form" class="form-grid">${input('Nom de l’entreprise','companyName',s.companyName)}${input('Nom du gérant','manager',s.manager)}${input('Téléphones','phone',s.phone)}${input('Adresse','address',s.address)}${input('E-mail','email',s.email)}${input('Site web','website',s.website)}<div class="full"><button class="primary">${ico('save',17)} Enregistrer</button></div></form></div><div class="panel form-panel" style="margin-top:18px"><div class="panel-head"><div><h2 class="panel-title">Éléments visuels</h2><p class="muted">Importez, redimensionnez et positionnez vos éléments. Les réglages restent enregistrés dans cet appareil.</p></div></div><div class="media-cards">${mediaCard('signature','Signature','pen-line')}${mediaCard('stamp','Cachet','stamp')}</div><div class="media-card" style="margin-top:14px"><div style="display:flex;align-items:center;justify-content:space-between"><div><strong style="font-size:13px">${ico('image',17)} Logo de l’en-tête</strong><p class="muted">Déplacez-le et ajustez sa taille dans l’en-tête de la facture.</p></div><button type="button" class="icon-btn" data-reset-media="logo" title="Réinitialiser le logo">${ico('rotate-ccw',16)}</button></div><div class="media-controls" style="margin-top:13px;max-width:520px"><label>Taille <input type="range" min="25" max="75" value="${s.logoSize||42}" data-media-range="logoSize"></label><label>X <input type="range" min="0" max="25" value="${s.logoX||0}" data-media-range="logoX"></label><label>Y <input type="range" min="0" max="30" value="${s.logoY||0}" data-media-range="logoY"></label></div></div><div class="position-stage" id="media-stage">${s.signature?`<div class="drag-media" data-drag-media="signature" style="left:${s.signatureX||0}%;top:${s.signatureY||35}%;width:${s.signatureSize||34}mm"><img src="${s.signature}"></div>`:''}${s.stamp?`<div class="drag-media" data-drag-media="stamp" style="left:${s.stampX||55}%;top:${s.stampY||35}%;width:${s.stampSize||30}mm"><img src="${s.stamp}"></div>`:''}</div><div class="position-stage header-stage" id="logo-stage"><div class="drag-media" data-drag-media="logo" style="left:${s.logoX||0}%;top:${s.logoY||20}%;width:${s.logoSize||42}mm"><img src="${ASSETS.logo}"></div></div></div><div class="panel form-panel" style="margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap"><div><h2 class="panel-title">Données locales</h2><p class="muted">Sauvegardez ou réinitialisez vos données.</p></div><div style="display:flex;gap:8px"><button class="input" style="width:auto" data-backup>Exporter JSON</button><button class="input" style="width:auto;color:#c33" data-reset>Réinitialiser</button></div></div></div>`}
function editInvoice(id){editingId=id;page='create';persist();render()}
function removeInvoice(id){confirmBox('Supprimer cette facture ?').then(r=>{if(r.isConfirmed){state.invoices=state.invoices.filter(x=>x.id!==id);persist();notify('Facture supprimée');render()}})}
function setStatus(status,id){const x=state.invoices.find(i=>i.id===id);if(x){x.status=status;persist();notify(status==='validated'?'Facture validée':'Facture marquée négociée');render()}}
function convertProforma(id){const x=state.invoices.find(i=>i.id===id);if(x&&x.type==='proforma'){x.type='invoice';x.status='validated';x.convertedAt=new Date().toISOString();persist();notify('Pro forma validée : facture générée avec la même référence');render()}}
function showPreview(id){const x=state.invoices.find(i=>i.id===id);if(!x)return;const modal=document.createElement('div');modal.className='modal-backdrop';modal.innerHTML=`<div class="modal"><button class="icon-btn modal-close" data-action="modal-close">${ico('x',20)}</button><h2 class="panel-title" style="margin:4px 0 12px">Aperçu de la facture</h2><div style="max-height:75vh;overflow:auto">${invoiceMarkup(x)}</div></div>`;document.body.appendChild(modal);modal.querySelector('[data-action=modal-close]').addEventListener('click',()=>modal.remove());modal.addEventListener('click',e=>{if(e.target===modal)modal.remove()});if(Icons.createIcons)Icons.createIcons()}
function currentPreview(){const form=document.querySelector('#invoice-form');if(!form)return;const f=new FormData(form);const x={...Object.fromEntries(f.entries()),items:[...document.querySelectorAll('.line-item')].map(r=>({designation:r.querySelector('[name=designation]').value,qty:Number(r.querySelector('[name=qty]').value),unit:Number(r.querySelector('[name=unit]').value)}))};const modal=document.createElement('div');modal.className='modal-backdrop';modal.innerHTML=`<div class="modal a4-preview-modal"><div class="a4-toolbar"><div><strong class="panel-title">Aperçu A4 complet</strong><p class="muted">Vérifiez la facture avant exportation.</p></div><div style="display:flex;gap:8px"><button class="primary" data-a4-export>${ico('download',17)} Exporter PDF</button><button class="icon-btn modal-close">${ico('x',20)}</button></div></div><div class="a4-scroll"><div class="a4-preview-paper">${invoiceMarkup(x)}</div></div></div>`;document.body.appendChild(modal);modal.querySelector('.modal-close').addEventListener('click',()=>modal.remove());modal.querySelector('[data-a4-export]').addEventListener('click',()=>exportPdfData(x));modal.addEventListener('click',e=>{if(e.target===modal)modal.remove()});if(Icons.createIcons)Icons.createIcons({root:modal})}
function pdfFilename(x){return `${x.ref.replace(/[^a-z0-9]/gi,'_')}_${(x.client||'client').replace(/[^a-z0-9]/gi,'_')}.pdf`}
function makePdf(x){const holder=document.createElement('div');holder.style.position='fixed';holder.style.left='-10000px';holder.innerHTML=invoiceMarkup(x);document.body.appendChild(holder);if(Icons.createIcons)Icons.createIcons({root:holder});const opts={margin:0,filename:pdfFilename(x),image:{type:'jpeg',quality:.98},html2canvas:{scale:2,useCORS:true,backgroundColor:'#fff'},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}};if(!window.html2pdf){window.print();holder.remove();return Promise.resolve(null)}return html2pdf().set(opts).from(holder.firstElementChild).outputPdf('blob').then(blob=>{holder.remove();return blob}).catch(err=>{holder.remove();throw err})}
function exportPdfData(x){makePdf(x).then(blob=>{if(!blob)return;const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=pdfFilename(x);a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);notify('PDF téléchargé')}).catch(()=>notify('Impossible de générer le PDF','error'))}
function exportPdf(id){const x=state.invoices.find(i=>i.id===id);if(x)exportPdfData(x)}
function sharePdf(id){const x=state.invoices.find(i=>i.id===id);if(!x)return;makePdf(x).then(blob=>{if(!blob)return;const file=new File([blob],pdfFilename(x),{type:'application/pdf'});if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]})))return navigator.share({title:x.ref,text:`Facture ${x.ref} — ${x.client}`,files:[file]}).then(()=>notify('PDF partagé'));exportPdfData(x)}).catch(()=>notify('Partage indisponible : le PDF a été téléchargé','warning'))}
function offerPdf(id){const x=state.invoices.find(i=>i.id===id);if(!x)return;if(window.Swal&&typeof Swal.fire==='function'){Swal.fire({title:'Facture enregistrée',text:'Souhaitez-vous exporter ou partager le PDF maintenant ?',icon:'success',showDenyButton:true,showCancelButton:true,confirmButtonText:'Exporter le PDF',denyButtonText:'Partager le PDF',cancelButtonText:'Plus tard',confirmButtonColor:'#123b85',denyButtonColor:'#168fd0'}).then(r=>{if(r.isConfirmed)exportPdf(id);else if(r.isDenied)sharePdf(id)})}else if(window.confirm('Exporter le PDF maintenant ?'))exportPdf(id)}
function readImage(e){const file=e.target.files?.[0],key=e.currentTarget.dataset.image;if(!file)return;const r=new FileReader();r.onload=()=>{state.settings[key]=r.result;persist();notify('Image enregistrée');render()};r.readAsDataURL(file)}
function saveSettings(e){e.preventDefault();const f=new FormData(e.currentTarget);state.settings={...state.settings,companyName:f.get('companyName'),manager:f.get('manager'),phone:f.get('phone'),address:f.get('address'),email:f.get('email'),website:f.get('website')};persist();notify('Paramètres enregistrés');render()}
function downloadBackup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='le-facturier-sauvegarde.json';a.click();notify('Sauvegarde téléchargée')}
function resetData(){confirmBox('Réinitialiser les données ?').then(r=>{if(r.isConfirmed){localStorage.removeItem(STORE);state=readStore();page='dashboard';persist();notify('Données réinitialisées');render()}})}
document.addEventListener('input',e=>{if(e.target.closest('#invoice-form')&&(e.target.name==='qty'||e.target.name==='unit'))updateEditorTotal()});
render();if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
})();
</script>
</body>
</html>
